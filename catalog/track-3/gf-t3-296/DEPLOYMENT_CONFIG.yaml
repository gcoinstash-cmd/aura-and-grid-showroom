apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gf-t3-296
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "64"
    spec:
      containers:
        - image: gcr.io/ghost-factory/gf-t3-296:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENGINE_ID
              value: "GF-T3-296"
            - name: ACTIVE_CORRIDOR
              value: "FP8-CORRIDOR-ALPHA"
