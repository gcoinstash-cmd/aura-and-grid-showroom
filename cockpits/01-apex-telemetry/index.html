<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX-TELEMETRY // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import ReactDOM from 'react-dom/client';


const REGIONS = [
  { id: 'US-EAST', name: 'US-East (Virginia)', ping: 12.4, jitter: 0.8, status: 'OPTIMAL' },
  { id: 'US-WEST', name: 'US-West (Oregon)', ping: 24.1, jitter: 1.2, status: 'OPTIMAL' },
  { id: 'EU-CENTRAL', name: 'EU-Central (Frankfurt)', ping: 78.6, jitter: 2.1, status: 'OPTIMAL' },
  { id: 'AP-TOKYO', name: 'AP-East (Tokyo)', ping: 114.2, jitter: 3.4, status: 'DEGRADED' },
  { id: 'SA-BRAZIL', name: 'SA-East (São Paulo)', ping: 132.8, jitter: 4.1, status: 'OPTIMAL' }
];

function ApexTelemetryCockpit() {
  const [activeRegion, setActiveRegion] = useState('ALL');
  const [tickSpeed, setTickSpeed] = useState(600);
  const [isPaused, setIsPaused] = useState(false);
  const [p99Latency, setP99Latency] = useState(14.2);
  const [packetRate, setPacketRate] = useState(42800);
  const [wavePoints, setWavePoints] = useState([20, 25, 22, 35, 60, 15, 22, 28, 25, 22, 30, 75, 18, 24]);
  const [logFeed, setLogFeed] = useState([]);
  const canvasRef = useRef(null);

  // Realtime Simulation Engine
  useEffect(() => {
    if (isPaused) return;
    const interval = setInterval(() => {
      // Fluctuate dials smoothly
      setP99Latency(prev => Number((prev + (Math.random() * 1.6 - 0.8)).toFixed(1)));
      setPacketRate(prev => Math.round(prev + (Math.random() * 600 - 300)));

      // Advance wave
      const newPoint = Math.random() > 0.8 ? Math.floor(Math.random() * 60 + 20) : Math.floor(Math.random() * 15 + 18);
      setWavePoints(prev => [...prev.slice(1), newPoint]);

      // Push new telemetry heartbeat log
      const regions = ['US-EAST', 'US-WEST', 'EU-CENTRAL', 'AP-TOKYO'];
      const chosenRegion = regions[Math.floor(Math.random() * regions.length)];
      const latencyVal = (Math.random() * 12 + 10).toFixed(1);

      setLogFeed(prev => [
        {
          id: Math.random().toString(36).slice(2, 8),
          time: new Date().toISOString().split('T')[1].slice(0, 12),
          region: chosenRegion,
          latency: `${latencyVal}ms`,
          status: 'HTTP 200 OK',
          delta: `${(Math.random() * 0.4 - 0.2).toFixed(2)}ms`
        },
        ...prev.slice(0, 7)
      ]);
    }, tickSpeed);

    return () => clearInterval(interval);
  }, [tickSpeed, isPaused]);

  // Render SVG Heartbeat Wave
  const waveSvgPath = wavePoints
    .map((pt, idx) => {
      const x = (idx / (wavePoints.length - 1)) * 320;
      const y = 90 - pt;
      return `${idx === 0 ? 'M' : 'L'} ${x} ${y}`;
    })
    .join(' ');

  const filteredRegions = activeRegion === 'ALL' ? REGIONS : REGIONS.filter(r => r.id === activeRegion);

  return (
    <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
      {/* Background Carbon Mesh Pattern */}
      <div className="max-w-7xl mx-auto space-y-6">
        
        {/* TOP STATUS BAR // F1 PIT WALL TELEMETRY HEADER */}
        <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
          <div className="flex items-center gap-3">
            <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-ping" />
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-APEX-01</span>
              </div>
              <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                APEX-TELEMETRY <span className="text-xs text-[#00F0FF] font-normal">// PIT WALL COCKPIT</span>
              </h1>
            </div>
          </div>

          <div className="flex items-center gap-4 text-xs font-mono">
            <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
              <span className="text-slate-400">ENGINE STATE:</span>
              <span className="text-[#00F0FF] font-bold">120 FPS // NOMINAL</span>
            </div>
            <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
              <span className="text-slate-400">P99 JITTER:</span>
              <span className="text-[#FF9F0A] font-bold">±0.42ms</span>
            </div>
          </div>
        </header>

        {/* MAIN TELEMETRY GRID */}
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          
          {/* LEFT 2 COLUMNS: GAUGES & REALTIME PULSE */}
          <div className="lg:col-span-2 space-y-6">
            
            {/* DUAL DIAL GAUGES */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {/* GAUGE 1: P99 LATENCY */}
              <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                <div className="flex justify-between items-start mb-2">
                  <span className="text-xs font-mono tracking-wider text-slate-400 uppercase">SERVER LATENCY (P99)</span>
                  <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">REALTIME</span>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{p99Latency}</span>
                  <span className="text-sm font-mono text-[#00F0FF]">ms</span>
                </div>
                <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                  <span>BASELINE: 12.0ms</span>
                  <span className="text-green-400 font-bold">LOW VARIANCE</span>
                </div>
                {/* Horizontal Level Bar */}
                <div className="w-full bg-[#1F2937] h-1.5 rounded-full mt-2 overflow-hidden">
                  <div className="bg-[#00F0FF] h-full transition-all duration-300" style={{ width: `${Math.min(100, (p99Latency / 30) * 100)}%` }} />
                </div>
              </div>

              {/* GAUGE 2: INGESTION RATE */}
              <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                <div className="flex justify-between items-start mb-2">
                  <span className="text-xs font-mono tracking-wider text-slate-400 uppercase">INGESTION THROUGHPUT</span>
                  <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">STREAMING</span>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{packetRate.toLocaleString()}</span>
                  <span className="text-sm font-mono text-[#FF9F0A]">req/s</span>
                </div>
                <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                  <span>CAPACITY: 100,000</span>
                  <span className="text-[#FF9F0A] font-bold">42.8% SATURATION</span>
                </div>
                {/* Horizontal Level Bar */}
                <div className="w-full bg-[#1F2937] h-1.5 rounded-full mt-2 overflow-hidden">
                  <div className="bg-[#FF9F0A] h-full transition-all duration-300" style={{ width: `${(packetRate / 100000) * 100}%` }} />
                </div>
              </div>
            </div>

            {/* REALTIME HEARTBEAT OSCILLOSCOPE WAVE */}
            <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-[#1F2937] pb-3">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                  <h2 className="text-sm font-mono font-bold uppercase text-white tracking-wider">CLUSTER HEARTBEAT OSCILLOSCOPE</h2>
                </div>
                <div className="flex items-center gap-3 text-xs font-mono">
                  <button 
                    onClick={() => setIsPaused(!isPaused)} 
                    className="px-2.5 py-1 rounded bg-[#1F2937] hover:bg-slate-700 text-xs font-mono transition text-slate-200">
                    {isPaused ? '▶ RESUME' : '⏸ PAUSE'}
                  </button>
                  <span className="text-slate-400">INTERVAL: {tickSpeed}ms</span>
                </div>
              </div>

              {/* SVG Wave Visualizer */}
              <div className="h-32 bg-[#05070B] border border-[#1F2937] rounded-lg p-2 relative overflow-hidden flex items-center">
                <div className="absolute inset-0 bg-[linear-gradient(to_right,#1F2937_1px,transparent_1px),linear-gradient(to_bottom,#1F2937_1px,transparent_1px)] bg-[size:16px_16px] opacity-25" />
                <svg className="w-full h-full" viewBox="0 0 320 90" preserveAspectRatio="none">
                  <path d={waveSvgPath} fill="none" stroke="#00F0FF" strokeWidth="2.5" strokeLinecap="round" />
                  <path d={`${waveSvgPath} L 320 90 L 0 90 Z`} fill="url(#cyanGlow)" opacity="0.15" />
                  <defs>
                    <linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#00F0FF" />
                      <stop offset="100%" stopColor="#00F0FF" stopOpacity="0" />
                    </linearGradient>
                  </defs>
                </svg>
              </div>
            </div>

            {/* REGIONAL TELEMETRY MESH TABLE */}
            <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3 border-b border-[#1F2937] pb-3">
                <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider">REGIONAL EDGE NODES</h3>
                <div className="flex gap-1.5 font-mono text-xs">
                  {['ALL', 'US-EAST', 'US-WEST', 'EU-CENTRAL', 'AP-TOKYO'].map(reg => (
                    <button
                      key={reg}
                      onClick={() => setActiveRegion(reg)}
                      className={`px-2.5 py-1 rounded transition ${activeRegion === reg ? 'bg-[#00F0FF] text-black font-bold' : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'}`}>
                      {reg}
                    </button>
                  ))}
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left font-mono text-xs">
                  <thead>
                    <tr className="border-b border-[#1F2937] text-slate-400">
                      <th className="py-2">NODE REGION</th>
                      <th className="py-2">LATENCY</th>
                      <th className="py-2">JITTER</th>
                      <th className="py-2">SIGNAL TIER</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#1F2937]">
                    {filteredRegions.map(node => (
                      <tr key={node.id} className="hover:bg-slate-800/30">
                        <td className="py-2.5 text-white font-bold">{node.name}</td>
                        <td className="py-2.5 text-[#00F0FF]">{node.ping}ms</td>
                        <td className="py-2.5 text-slate-300">±{node.jitter}ms</td>
                        <td className="py-2.5">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${node.status === 'OPTIMAL' ? 'bg-green-500/10 text-green-400' : 'bg-[#FF9F0A]/10 text-[#FF9F0A]'}`}>
                            {node.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

          </div>

          {/* RIGHT COLUMN: LIVE PACKET FEED & COMMERCIAL TITLE ACTIONS */}
          <div className="space-y-6">

            {/* DEALERSHIP WINDOW STICKER / COMMERCIAL APA TRANSFER DRAWER */}
            <div className="bg-[#0D1117] border-2 border-[#FF9F0A] p-5 rounded-xl space-y-4 shadow-[0_0_20px_rgba(255,159,10,0.1)]">
              <div className="flex justify-between items-start border-b border-[#1F2937] pb-3">
                <div>
                  <div className="text-[10px] font-mono tracking-widest text-[#FF9F0A] uppercase font-bold">100% PURE APA TITLE TRANSFER</div>
                  <h3 className="text-base font-mono font-black text-white">DEALERSHIP MONRONEY</h3>
                </div>
                <div className="text-right">
                  <div className="text-2xl font-black font-mono text-[#00F0FF]">$14,500</div>
                  <div className="text-[10px] font-mono text-slate-400">RETAIL BUYOUT ANCHOR</div>
                </div>
              </div>

              <div className="space-y-2 text-xs font-mono text-slate-300">
                <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                  <span className="text-slate-400">Asset Class:</span>
                  <span className="text-white">Track 2 (Hypercar Flagship)</span>
                </div>
                <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                  <span className="text-slate-400">Code Rights:</span>
                  <span className="text-white">100% Outright IP Transfer</span>
                </div>
                <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                  <span className="text-slate-400">Vault Buyout Range:</span>
                  <span className="text-[#FF9F0A]">$25,000 – $50,000</span>
                </div>
                <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                  <span className="text-slate-400">Compliance Standard:</span>
                  <span className="text-green-400">NIST SP 800-218 Clean-Room</span>
                </div>
              </div>

              {/* STRICT ACTION TARGET CTAs */}
              <div className="flex flex-col gap-2 w-full pt-2">
                <button 
                  onClick={() => alert('Initiating APA Title Transfer for GF-T2-APEX-01 ($14,500 Anchor). Transfer manifest generated.')}
                  className="w-full py-3 bg-[#FF9F0A] hover:bg-[#e08b08] text-black font-mono font-black tracking-wider text-xs uppercase rounded-lg transition transform active:scale-95 shadow-lg shadow-[#FF9F0A]/20">
                  ACQUIRE TITLE (APA)
                </button>
                <button 
                  onClick={() => alert('Vault Buyout inquiry submitted for APEX-TELEMETRY ($25k - $50k Exclusive Range).')}
                  className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold tracking-wider text-xs uppercase rounded-lg border border-slate-600 transition">
                  INQUIRE VAULT BUYOUT
                </button>
              </div>
            </div>

            {/* LIVE PACKET INGESTION FEED */}
            <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
              <div className="flex justify-between items-center border-b border-[#1F2937] pb-3">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-[#FF9F0A] animate-pulse" />
                  <h4 className="text-xs font-mono font-bold text-white uppercase tracking-wider">LIVE HEARTBEAT LOG</h4>
                </div>
                <span className="text-[10px] font-mono text-slate-400">STREAMING</span>
              </div>

              <div className="space-y-2 font-mono text-[11px]">
                {logFeed.map(log => (
                  <div key={log.id} className="bg-[#05070B] border border-[#1F2937] p-2 rounded flex items-center justify-between">
                    <div>
                      <div className="text-white font-bold">{log.region}</div>
                      <div className="text-slate-500 text-[10px]">{log.time}</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[#00F0FF] font-bold">{log.latency}</div>
                      <div className="text-slate-400 text-[10px]">{log.delta}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<ApexTelemetryCockpit />);
  </script>
</body>
</html>
