<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPHER-STRIKE // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const CRYPTO_SUITES = [
      { id: 'SUITE-ML-KEM-1024', name: 'Kyber-1024 (Post-Quantum)', category: 'POST-QUANTUM', status: 'ACTIVE', entropy: '99.99%', epoch: '12d 4h' },
      { id: 'SUITE-ML-DSA-87', name: 'Dilithium-5 Signature', category: 'POST-QUANTUM', status: 'ACTIVE', entropy: '99.97%', epoch: '4d 18h' },
      { id: 'SUITE-ED25519-PH', name: 'Ed25519 Token Signer', category: 'ASYMMETRIC', status: 'ACTIVE', entropy: '99.88%', epoch: '21d 2h' },
      { id: 'SUITE-AES-256-GCM', name: 'Hardware AES-NI Enclave', category: 'CLASSICAL-KMS', status: 'ROTATING', entropy: '99.92%', epoch: '29d 23h' },
      { id: 'SUITE-FALCON-1024', name: 'Falcon-1024 Enclave Anchor', category: 'POST-QUANTUM', status: 'LOCKED', entropy: '100.0%', epoch: '90d 0h' }
    ];

    function CipherStrikeCockpit() {
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [entropyPool, setEntropyPool] = useState(99.94);
      const [derivationsPerSec, setDerivationsPerSec] = useState(4280);
      const [epochCountdown, setEpochCountdown] = useState(3600);
      const [auditLogs, setAuditLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setEpochCountdown(prev => (prev > 0 ? prev - 1 : 3600));
          setEntropyPool(Number((99.88 + Math.random() * 0.1).toFixed(3)));
          setDerivationsPerSec(prev => prev + Math.floor((Math.random() - 0.5) * 80));

          const algorithms = ['ML-KEM-1024', 'Dilithium-5', 'Ed25519', 'AES-256-GCM'];
          const clients = ['ENCLAVE-ALPHA', 'GATEWAY-CHIEF', 'HSM-CLUSTER-07', 'MESH-TRACER'];
          const algo = algorithms[Math.floor(Math.random() * algorithms.length)];
          const client = clients[Math.floor(Math.random() * clients.length)];
          const nonce = '0x' + Math.random().toString(16).substring(2, 12).toUpperCase();

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            algo,
            client,
            nonce,
            status: 'VERIFIED'
          };

          setAuditLogs(prev => [newLog, ...prev.slice(0, 6)]);
        }, 900);

        return () => clearInterval(interval);
      }, []);

      const filteredSuites = filterCategory === 'ALL' ? CRYPTO_SUITES : CRYPTO_SUITES.filter(s => s.category === filterCategory);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER STATUS */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#FF9F0A] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-CIPHER-02</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    CIPHER-STRIKE <span className="text-xs text-[#FF9F0A] font-normal">// POST-QUANTUM ENTROPY & KEY ROTATION</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">TRNG HARDWARE:</span>
                  <span className="text-green-400 font-bold">ANALOG SEED OK</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">NEXT ROTATION:</span>
                  <span className="text-[#00F0FF] font-bold">{Math.floor(epochCountdown / 60)}m {epochCountdown % 60}s</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS & SUITE REGISTRY */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">HARDWARE ENTROPY QUALITY</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">FIPS 140-3 LEVEL 4</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{entropyPool}%</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">TRNG</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>NOISE SOURCE: DIODE BREAKDOWN</span>
                      <span className="text-green-400 font-bold">OPTIMAL</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">DERIVATION THROUGHPUT</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">HKDF-SHA512</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{derivationsPerSec.toLocaleString()}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">keys/sec</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>HARDWARE ENCLAVE: ACTIVE</span>
                      <span className="text-green-400 font-bold">SUB-1MS</span>
                    </div>
                  </div>
                </div>

                {/* CRYPTOGRAPHIC SUITE REGISTRY */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      ACTIVE CIPHER & KEY MATRIX
                    </h3>
                    <div className="flex gap-2">
                      {['ALL', 'POST-QUANTUM', 'CLASSICAL-KMS', 'ASYMMETRIC'].map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setFilterCategory(cat)}
                          className={`px-3 py-1 rounded text-xs font-mono font-bold uppercase transition-colors ${
                            filterCategory === cat
                              ? 'bg-[#FF9F0A] text-black'
                              : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-400">
                          <th className="py-2 px-3">SUITE ID</th>
                          <th className="py-2 px-3">ALGORITHM SPEC</th>
                          <th className="py-2 px-3">CATEGORY</th>
                          <th className="py-2 px-3">ENTROPY</th>
                          <th className="py-2 px-3">KEY AGE</th>
                          <th className="py-2 px-3 text-right">ENCLAVE STATE</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {filteredSuites.map((s) => (
                          <tr key={s.id} className="hover:bg-[#1F2937]/30 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{s.id}</td>
                            <td className="py-2.5 px-3 text-white font-bold">{s.name}</td>
                            <td className="py-2.5 px-3 text-slate-400">{s.category}</td>
                            <td className="py-2.5 px-3 text-green-400 font-bold">{s.entropy}</td>
                            <td className="py-2.5 px-3 text-slate-300">{s.epoch}</td>
                            <td className="py-2.5 px-3 text-right">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                s.status === 'ACTIVE' ? 'bg-green-500/10 text-green-400 border border-green-500/30' :
                                s.status === 'ROTATING' ? 'bg-[#FF9F0A]/10 text-[#FF9F0A] border border-[#FF9F0A]/30' :
                                'bg-slate-700 text-slate-300'
                              }`}>
                                {s.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: DEALERSHIP SPEC & LIVE NONCE LEDGER */}
              <div className="space-y-6">

                {/* DEALERSHIP MONRONEY SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono text-[#00F0FF] font-bold tracking-widest uppercase">SPECIFICATION MONRONEY</span>
                    <h2 className="text-lg font-black text-white font-mono mt-1">GF-T2-CIPHER-02</h2>
                    <p className="text-xs text-slate-400 font-sans">Track 2 Hypercar Flagship Cryptography Console</p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">MODEL</span>
                      <span className="text-white font-bold">CIPHER-STRIKE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE NONCE AUDIT LOG */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#FF9F0A] animate-ping" />
                      LIVE DERIVATION AUDIT STREAM
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">ENCLAVE LOGS</span>
                  </div>

                  <div className="space-y-2">
                    {auditLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-[#00F0FF] font-bold">{log.algo}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="font-mono text-slate-400">{log.nonce}</span>
                          <span className="text-green-400 font-bold">{log.status}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CipherStrikeCockpit />);
  </script>
</body>
</html>
