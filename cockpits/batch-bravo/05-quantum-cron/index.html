<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUANTUM-CRON // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const DISTRIBUTED_JOBS = [
      { id: 'Q-JOB-01', name: 'Global Ledger Epoch Finalizer', type: 'CRITICAL-SYNC', region: 'MULTI-REGION', cron: '0 * * * *', latency: '14ms', status: 'RUNNING' },
      { id: 'Q-JOB-02', name: 'AlloyDB Read-Replica Catchup', type: 'DATA-PIPELINE', region: 'US-EAST', cron: '*/10 * * * * *', latency: '4.2ms', status: 'NOMINAL' },
      { id: 'Q-JOB-03', name: 'Raft Peer Heartbeat Broadcast', type: 'HEALTH-BEACON', region: 'GLOBAL-MESH', cron: '*/1 * * * * *', latency: '0.8ms', status: 'NOMINAL' },
      { id: 'Q-JOB-04', name: 'Cross-Region Snapshot Mirror', type: 'DATA-PIPELINE', region: 'EU-CENTRAL', cron: '0 */4 * * *', latency: '340ms', status: 'QUEUED' }
    ];

    function QuantumCronCockpit() {
      const [filterType, setFilterType] = useState('ALL');
      const [ptpDrift, setPtpDrift] = useState(148);
      const [activeLeases, setActiveLeases] = useState(32);
      const [dispatchLogs, setDispatchLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setPtpDrift(Math.floor(120 + Math.random() * 60));
          setActiveLeases(prev => Math.min(48, Math.max(20, prev + (Math.random() > 0.5 ? 1 : -1))));

          const jobs = ['Q-JOB-01', 'Q-JOB-02', 'Q-JOB-03', 'Q-JOB-04'];
          const regions = ['US-EAST', 'EU-CENTRAL', 'AP-TOKYO'];
          const job = jobs[Math.floor(Math.random() * jobs.length)];
          const region = regions[Math.floor(Math.random() * regions.length)];
          const worker = `WORKER-TH-${Math.floor(Math.random() * 16)}`;
          const duration = (1.8 + Math.random() * 14.2).toFixed(1);

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            job,
            region,
            worker,
            duration: `${duration}ms`
          };

          setDispatchLogs(prev => [newLog, ...prev.slice(0, 6)]);
        }, 850);

        return () => clearInterval(interval);
      }, []);

      const filteredJobs = filterType === 'ALL' ? DISTRIBUTED_JOBS : DISTRIBUTED_JOBS.filter(j => j.type === filterType);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER STATUS */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-QUANTUM-05</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    QUANTUM-CRON <span className="text-xs text-[#FF9F0A] font-normal">// DISTRIBUTED MULTI-REGION SCHEDULER</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">RAFT LEADER:</span>
                  <span className="text-green-400 font-bold">NODE-US-EAST-01</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">PTP PRECISION:</span>
                  <span className="text-[#00F0FF] font-bold">±{ptpDrift}µs</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS & JOB MATRIX */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">ATOMIC CLOCK DRIFT (PTP)</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">IEEE 1588</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">±{ptpDrift}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">µs</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>MAX DRIFT TOLERANCE: 500µs</span>
                      <span className="text-green-400 font-bold">SYNCHRONIZED</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">DISTRIBUTED LEASE LOCKS</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">ETCD CONSENSUS</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{activeLeases}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">leases</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>DEADLOCKS DETECTED: 0</span>
                      <span className="text-[#00F0FF]">CLEAN LOCK</span>
                    </div>
                  </div>
                </div>

                {/* DISTRIBUTED JOB MATRIX TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#FF9F0A]" />
                      DISTRIBUTED CRON INVENTORY
                    </h3>
                    <div className="flex gap-2">
                      {['ALL', 'CRITICAL-SYNC', 'DATA-PIPELINE', 'HEALTH-BEACON'].map((type) => (
                        <button
                          key={type}
                          onClick={() => setFilterType(type)}
                          className={`px-3 py-1 rounded text-xs font-mono font-bold uppercase transition-colors ${
                            filterType === type
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          {type}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-400">
                          <th className="py-2 px-3">JOB ID</th>
                          <th className="py-2 px-3">NAME</th>
                          <th className="py-2 px-3">REGION</th>
                          <th className="py-2 px-3">CRON SPEC</th>
                          <th className="py-2 px-3">LATENCY</th>
                          <th className="py-2 px-3 text-right">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {filteredJobs.map((j) => (
                          <tr key={j.id} className="hover:bg-[#1F2937]/30 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{j.id}</td>
                            <td className="py-2.5 px-3 text-white font-bold">{j.name}</td>
                            <td className="py-2.5 px-3 text-slate-400">{j.region}</td>
                            <td className="py-2.5 px-3 text-slate-300 font-mono">{j.cron}</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A]">{j.latency}</td>
                            <td className="py-2.5 px-3 text-right">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                j.status === 'RUNNING' ? 'bg-[#00F0FF]/10 text-[#00F0FF] border border-[#00F0FF]/30' :
                                j.status === 'NOMINAL' ? 'bg-green-500/10 text-green-400 border border-green-500/30' :
                                'bg-slate-700 text-slate-300'
                              }`}>
                                {j.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: DEALERSHIP SPEC & LIVE DISPATCH FEED */}
              <div className="space-y-6">

                {/* DEALERSHIP MONRONEY SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono text-[#00F0FF] font-bold tracking-widest uppercase">SPECIFICATION MONRONEY</span>
                    <h2 className="text-lg font-black text-white font-mono mt-1">GF-T2-QUANTUM-05</h2>
                    <p className="text-xs text-slate-400 font-sans">Track 2 Hypercar Flagship Scheduler</p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">MODEL</span>
                      <span className="text-white font-bold">QUANTUM-CRON</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE DISPATCH LOG */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE CONSENSUS DISPATCH FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">RAFT WORKERS</span>
                  </div>

                  <div className="space-y-2">
                    {dispatchLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold truncate max-w-[150px]">{log.job}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-slate-400">{log.region} // {log.worker}</span>
                          <span className="text-green-400 font-bold">{log.duration}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<QuantumCronCockpit />);
  </script>
</body>
</html>
