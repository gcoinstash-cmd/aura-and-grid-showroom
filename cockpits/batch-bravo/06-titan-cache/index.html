<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITAN-CACHE // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const CACHE_SEGMENTS = [
      { id: 'SEG-L1-SESSION', tier: 'L1-HOT-RAM', capacity: '16 GB', used: '12.4 GB', hitRate: '99.8%', eviction: 'ARC' },
      { id: 'SEG-L1-USER-STATE', tier: 'L1-HOT-RAM', capacity: '32 GB', used: '28.1 GB', hitRate: '99.2%', eviction: 'LRU-CLOCK' },
      { id: 'SEG-L2-QUERY-TIER', tier: 'L2-NVME-CACHE', capacity: '128 GB', used: '84.6 GB', hitRate: '96.4%', eviction: 'W-TINY-LFU' },
      { id: 'SEG-EXT-INDEX-SINK', tier: 'TIERED-STORAGE', capacity: '512 GB', used: '210.4 GB', hitRate: '92.1%', eviction: 'FIFO' }
    ];

    function TitanCacheCockpit() {
      const [filterTier, setFilterTier] = useState('ALL');
      const [hitRate, setHitRate] = useState(99.4);
      const [evictionRate, setEvictionRate] = useState(24);
      const [cacheLogs, setCacheLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setHitRate(Number((99.1 + Math.random() * 0.7).toFixed(2)));
          setEvictionRate(prev => Math.max(4, prev + Math.floor((Math.random() - 0.5) * 6)));

          const keys = ['usr:sess:9021', 'route:cfg:v1', 'tok:auth:ed25519', 'dag:stg:04', 'cache:lock:77'];
          const segments = ['SEG-L1-SESSION', 'SEG-L1-USER-STATE', 'SEG-L2-QUERY-TIER'];
          const results = ['HIT', 'HIT', 'HIT', 'MISS'];
          const key = keys[Math.floor(Math.random() * keys.length)];
          const segment = segments[Math.floor(Math.random() * segments.length)];
          const res = results[Math.floor(Math.random() * results.length)];
          const lat = (0.04 + Math.random() * 0.4).toFixed(3);

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            key,
            segment,
            res,
            lat: `${lat}ms`
          };

          setCacheLogs(prev => [newLog, ...prev.slice(0, 6)]);
        }, 800);

        return () => clearInterval(interval);
      }, []);

      const filteredSegments = filterTier === 'ALL' ? CACHE_SEGMENTS : CACHE_SEGMENTS.filter(s => s.tier === filterTier);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER STATUS */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-TITAN-06</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    TITAN-CACHE <span className="text-xs text-[#FF9F0A] font-normal">// IN-MEMORY BUFFER & HIT-RATE GAUGE</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">SLAB ALLOCATOR:</span>
                  <span className="text-green-400 font-bold">ZERO FRAG (JEMALLOC)</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">EVICTION ENGINE:</span>
                  <span className="text-[#00F0FF] font-bold">ADAPTIVE (ARC)</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS & SEGMENTS */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">AGGREGATE L1 HIT RATIO</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">SUB-MICROSECOND</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{hitRate}%</span>
                      <span className="text-sm font-mono text-[#00F0FF]">HITS</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>MISS RATIO: {(100 - hitRate).toFixed(2)}%</span>
                      <span className="text-green-400 font-bold">O(1) LOOKUP</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">BUFFER EVICTION VELOCITY</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">ADAPTIVE REPLACEMENT</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{evictionRate}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">evict/s</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>SLAB HEADROOM: 34.2 GB</span>
                      <span className="text-green-400 font-bold">STEADY STATE</span>
                    </div>
                  </div>
                </div>

                {/* MEMORY SEGMENT ALLOCATION MATRIX */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      MEMORY SEGMENT ALLOCATION MATRIX
                    </h3>
                    <div className="flex gap-2">
                      {['ALL', 'L1-HOT-RAM', 'L2-NVME-CACHE', 'TIERED-STORAGE'].map((tier) => (
                        <button
                          key={tier}
                          onClick={() => setFilterTier(tier)}
                          className={`px-3 py-1 rounded text-xs font-mono font-bold uppercase transition-colors ${
                            filterTier === tier
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          {tier}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-400">
                          <th className="py-2 px-3">SEGMENT ID</th>
                          <th className="py-2 px-3">TIER</th>
                          <th className="py-2 px-3">CAPACITY</th>
                          <th className="py-2 px-3">ALLOCATED</th>
                          <th className="py-2 px-3">HIT RATIO</th>
                          <th className="py-2 px-3 text-right">EVICTION POLICY</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {filteredSegments.map((s) => (
                          <tr key={s.id} className="hover:bg-[#1F2937]/30 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{s.id}</td>
                            <td className="py-2.5 px-3 text-slate-400">{s.tier}</td>
                            <td className="py-2.5 px-3 text-white">{s.capacity}</td>
                            <td className="py-2.5 px-3 text-slate-300">{s.used}</td>
                            <td className="py-2.5 px-3 text-green-400 font-bold">{s.hitRate}</td>
                            <td className="py-2.5 px-3 text-right">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-[#FF9F0A]/10 text-[#FF9F0A] border border-[#FF9F0A]/30">
                                {s.eviction}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: DEALERSHIP SPEC & LIVE HIT STREAM */}
              <div className="space-y-6">

                {/* DEALERSHIP MONRONEY SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono text-[#00F0FF] font-bold tracking-widest uppercase">SPECIFICATION MONRONEY</span>
                    <h2 className="text-lg font-black text-white font-mono mt-1">GF-T2-TITAN-06</h2>
                    <p className="text-xs text-slate-400 font-sans">Track 2 Hypercar Flagship Cache Console</p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">MODEL</span>
                      <span className="text-white font-bold">TITAN-CACHE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE CACHE LOOKUP FEED */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE BUFFER ACCESS STREAM
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">HOT KEY FEED</span>
                  </div>

                  <div className="space-y-2">
                    {cacheLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold truncate max-w-[150px]">{log.key}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-slate-400">{log.segment}</span>
                          <span className={`font-bold ${log.res === 'HIT' ? 'text-green-400' : 'text-[#FF9F0A]'}`}>
                            {log.res} ({log.lat})
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TitanCacheCockpit />);
  </script>
</body>
</html>
