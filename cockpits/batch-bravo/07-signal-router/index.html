<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGNAL-ROUTER // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const RPC_ROUTES = [
      { id: 'RPC-SRV-AUTH', service: 'auth.v1.TokenService', type: 'INTERNAL-RPC', p99: '4.8ms', weight: '100%', circuit: 'CLOSED' },
      { id: 'RPC-SRV-TELEMETRY', service: 'telemetry.v2.StreamIngest', type: 'INTERNAL-RPC', p99: '1.9ms', weight: '100%', circuit: 'CLOSED' },
      { id: 'RPC-SRV-ORDERBOOK', service: 'fintech.v1.OrderMatching', type: 'INTERNAL-RPC', p99: '2.4ms', weight: '90%', circuit: 'CLOSED' },
      { id: 'RPC-CANARY-ORDER', service: 'fintech.v2.CanaryMatch', type: 'CANARY', p99: '2.1ms', weight: '10%', circuit: 'CLOSED' },
      { id: 'RPC-EXT-PAYMENT', service: 'egress.v1.BankingBridge', type: 'EGRESS-SERVICE', p99: '48.2ms', weight: '100%', circuit: 'CLOSED' }
    ];

    function SignalRouterCockpit() {
      const [filterType, setFilterType] = useState('ALL');
      const [rpcRate, setRpcRate] = useState(14280);
      const [canaryWeight, setCanaryWeight] = useState(10);
      const [rpcLogs, setRpcLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setRpcRate(prev => prev + Math.floor((Math.random() - 0.5) * 180));

          const services = ['auth.v1.TokenService', 'telemetry.v2.StreamIngest', 'fintech.v1.OrderMatching', 'fintech.v2.CanaryMatch'];
          const methods = ['VerifyToken', 'PushTelemetry', 'SubmitLimitOrder', 'QueryStatus'];
          const srv = services[Math.floor(Math.random() * services.length)];
          const method = methods[Math.floor(Math.random() * methods.length)];
          const lat = (1.2 + Math.random() * 6.5).toFixed(1);

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            srv,
            method,
            status: 'OK (0)',
            lat: `${lat}ms`
          };

          setRpcLogs(prev => [newLog, ...prev.slice(0, 6)]);
        }, 850);

        return () => clearInterval(interval);
      }, []);

      const filteredRoutes = filterType === 'ALL' ? RPC_ROUTES : RPC_ROUTES.filter(r => r.type === filterType);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER STATUS */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-ROUTER-07</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    SIGNAL-ROUTER <span className="text-xs text-[#FF9F0A] font-normal">// MICROSERVICE RPC TRAFFIC SHAPER</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">CIRCUIT BREAKERS:</span>
                  <span className="text-green-400 font-bold">ALL CLOSED (100% UP)</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">PROTOCOL:</span>
                  <span className="text-[#00F0FF] font-bold">gRPC / HTTP/2</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, CANARY SLIDER, ROUTE MATRIX */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">AGGREGATE RPC INGRESS</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">MULTIPLEXED</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{rpcRate.toLocaleString()}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">rpc/s</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>P99 DEADLINE: &lt; 20ms</span>
                      <span className="text-green-400 font-bold">SUB-MILLI DISPATCH</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">CANARY TRAFFIC RATIO</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">BLUE/GREEN SPLIT</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{canaryWeight}%</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">CANARY</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>STABLE ROUTE: {100 - canaryWeight}%</span>
                      <span className="text-green-400 font-bold">ZERO FAULTS</span>
                    </div>
                  </div>
                </div>

                {/* CANARY WEIGHT INTERACTIVE SLIDER */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-3">
                  <div className="flex justify-between items-center text-xs font-mono">
                    <span className="text-white font-bold uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      INTERACTIVE CANARY TRAFFIC WEIGHT SLIDER
                    </span>
                    <span className="text-[#00F0FF]">{canaryWeight}% TO CANARY v2</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="50"
                    value={canaryWeight}
                    onChange={(e) => setCanaryWeight(Number(e.target.value))}
                    className="w-full accent-[#00F0FF] cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] font-mono text-slate-500">
                    <span>0% (100% STABLE)</span>
                    <span>25% CANARY</span>
                    <span>50% (MAX CANARY LIMIT)</span>
                  </div>
                </div>

                {/* RPC ROUTING MATRIX */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#FF9F0A]" />
                      MICROSERVICE ROUTING & CIRCUIT MATRIX
                    </h3>
                    <div className="flex gap-2">
                      {['ALL', 'INTERNAL-RPC', 'EGRESS-SERVICE', 'CANARY'].map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setFilterType(cat)}
                          className={`px-3 py-1 rounded text-xs font-mono font-bold uppercase transition-colors ${
                            filterType === cat
                              ? 'bg-[#FF9F0A] text-black'
                              : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-400">
                          <th className="py-2 px-3">ROUTE ID</th>
                          <th className="py-2 px-3">TARGET SERVICE</th>
                          <th className="py-2 px-3">TYPE</th>
                          <th className="py-2 px-3">P99</th>
                          <th className="py-2 px-3">WEIGHT</th>
                          <th className="py-2 px-3 text-right">CIRCUIT STATE</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {filteredRoutes.map((r) => (
                          <tr key={r.id} className="hover:bg-[#1F2937]/30 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{r.id}</td>
                            <td className="py-2.5 px-3 text-white font-bold">{r.service}</td>
                            <td className="py-2.5 px-3 text-slate-400">{r.type}</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">{r.p99}</td>
                            <td className="py-2.5 px-3 text-slate-300">{r.type === 'CANARY' ? `${canaryWeight}%` : r.weight}</td>
                            <td className="py-2.5 px-3 text-right">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/30">
                                {r.circuit}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: DEALERSHIP SPEC & LIVE RPC CALL STREAM */}
              <div className="space-y-6">

                {/* DEALERSHIP MONRONEY SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono text-[#00F0FF] font-bold tracking-widest uppercase">SPECIFICATION MONRONEY</span>
                    <h2 className="text-lg font-black text-white font-mono mt-1">GF-T2-ROUTER-07</h2>
                    <p className="text-xs text-slate-400 font-sans">Track 2 Hypercar Flagship Router Cockpit</p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">MODEL</span>
                      <span className="text-white font-bold">SIGNAL-ROUTER</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE RPC CALL STREAM */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE RPC INGRESS DISPATCH
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">HTTP/2 MESH</span>
                  </div>

                  <div className="space-y-2">
                    {rpcLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold truncate max-w-[150px]">{log.srv}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-[#00F0FF]">{log.method}</span>
                          <span className="text-green-400 font-bold">{log.lat}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SignalRouterCockpit />);
  </script>
</body>
</html>
