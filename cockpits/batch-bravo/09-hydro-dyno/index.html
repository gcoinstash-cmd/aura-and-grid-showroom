<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYDRO-DYNO // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const DB_NODES = [
      { id: 'DB-PRIMARY-WRITER', type: 'PRIMARY-WRITER', activeConn: 78, maxConn: 100, tps: '4,280 tps', lag: '0.0ms', status: 'HEALTHY' },
      { id: 'DB-REPLICA-RO-01', type: 'READ-REPLICA', activeConn: 42, maxConn: 100, tps: '8,410 tps', lag: '1.2ms', status: 'HEALTHY' },
      { id: 'DB-REPLICA-RO-02', type: 'READ-REPLICA', activeConn: 36, maxConn: 100, tps: '7,920 tps', lag: '1.4ms', status: 'HEALTHY' },
      { id: 'DB-ANALYTICS-POOL', type: 'ANALYTICS-POOL', activeConn: 18, maxConn: 50, tps: '340 tps', lag: '2.8ms', status: 'NOMINAL' }
    ];

    function HydroDynoCockpit() {
      const [filterType, setFilterType] = useState('ALL');
      const [poolSaturation, setPoolSaturation] = useState(74);
      const [lockWaitMs, setLockWaitMs] = useState(0.42);
      const [queryLogs, setQueryLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setPoolSaturation(prev => Math.min(95, Math.max(50, prev + (Math.random() > 0.5 ? 2 : -2))));
          setLockWaitMs(Number((0.35 + Math.random() * 0.18).toFixed(3)));

          const stmts = ['SELECT * FROM title_ledger WHERE unit_id = ?', 'INSERT INTO telemetry_stream VALUES (...)', 'UPDATE kms_key SET epoch = ?', 'SELECT count(*) FROM session_audit'];
          const pools = ['DB-PRIMARY-WRITER', 'DB-REPLICA-RO-01', 'DB-REPLICA-RO-02'];
          const stmt = stmts[Math.floor(Math.random() * stmts.length)];
          const pool = pools[Math.floor(Math.random() * pools.length)];
          const duration = (0.2 + Math.random() * 2.8).toFixed(2);
          const acquire = (0.02 + Math.random() * 0.08).toFixed(3);

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            stmt,
            pool,
            duration: `${duration}ms`,
            acquire: `${acquire}ms`
          };

          setQueryLogs(prev => [newLog, ...prev.slice(0, 6)]);
        }, 850);

        return () => clearInterval(interval);
      }, []);

      const filteredNodes = filterType === 'ALL' ? DB_NODES : DB_NODES.filter(n => n.type === filterType);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER STATUS */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-HYDRO-09</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    HYDRO-DYNO <span className="text-xs text-[#FF9F0A] font-normal">// DATABASE CONNECTION POOL DIAGNOSTIC</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">ENGINE:</span>
                  <span className="text-green-400 font-bold">POSTGRESQL 16 / ALLOYDB</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">POOL POINTER:</span>
                  <span className="text-[#00F0FF] font-bold">HIKARICP LEAK DETECT</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS & POOL NODES */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">PRIMARY POOL SATURATION</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">HIKARI HIGH WATER</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{poolSaturation}%</span>
                      <span className="text-sm font-mono text-[#00F0FF]">CAPACITY</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>IDLE CONNECTIONS: 26</span>
                      <span className="text-green-400 font-bold">REUSABLE</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">TRANSACTION LOCK WAIT TIME</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">SUB-MILLI LOCKS</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{lockWaitMs}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">ms</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>DEADLOCK DETECTIONS: 0</span>
                      <span className="text-green-400 font-bold">OPTIMAL</span>
                    </div>
                  </div>
                </div>

                {/* DATABASE CLUSTER NODES TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#FF9F0A]" />
                      CLUSTER CONNECTION ALLOCATION MATRIX
                    </h3>
                    <div className="flex gap-2">
                      {['ALL', 'PRIMARY-WRITER', 'READ-REPLICA', 'ANALYTICS-POOL'].map((type) => (
                        <button
                          key={type}
                          onClick={() => setFilterType(type)}
                          className={`px-3 py-1 rounded text-xs font-mono font-bold uppercase transition-colors ${
                            filterType === type
                              ? 'bg-[#FF9F0A] text-black'
                              : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          {type}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-400">
                          <th className="py-2 px-3">NODE ID</th>
                          <th className="py-2 px-3">POOL TYPE</th>
                          <th className="py-2 px-3">ACTIVE / MAX</th>
                          <th className="py-2 px-3">THROUGHPUT</th>
                          <th className="py-2 px-3">REPL LAG</th>
                          <th className="py-2 px-3 text-right">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {filteredNodes.map((n) => (
                          <tr key={n.id} className="hover:bg-[#1F2937]/30 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{n.id}</td>
                            <td className="py-2.5 px-3 text-slate-400">{n.type}</td>
                            <td className="py-2.5 px-3 text-white font-bold">{n.activeConn} / {n.maxConn}</td>
                            <td className="py-2.5 px-3 text-green-400">{n.tps}</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">{n.lag}</td>
                            <td className="py-2.5 px-3 text-right">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/30">
                                {n.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: DEALERSHIP SPEC & LIVE QUERY STREAM */}
              <div className="space-y-6">

                {/* DEALERSHIP MONRONEY SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono text-[#00F0FF] font-bold tracking-widest uppercase">SPECIFICATION MONRONEY</span>
                    <h2 className="text-lg font-black text-white font-mono mt-1">GF-T2-HYDRO-09</h2>
                    <p className="text-xs text-slate-400 font-sans">Track 2 Hypercar Flagship Database Cockpit</p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">MODEL</span>
                      <span className="text-white font-bold">HYDRO-DYNO</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE TRANSACTION QUERY LOG */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE TRANSACTION PROFILER
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">POSTGRES RLS</span>
                  </div>

                  <div className="space-y-2">
                    {queryLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold truncate max-w-[150px]">{log.stmt}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-slate-400">{log.pool}</span>
                          <span className="text-green-400 font-bold">{log.duration} (acq: {log.acquire})</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HydroDynoCockpit />);
  </script>
</body>
</html>
