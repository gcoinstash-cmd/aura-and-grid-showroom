<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER-METRIC // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const CDN_POPS = [
      { id: 'POP-US-EAST', region: 'NORTH-AMERICA', edgeHit: '99.8%', warmup: '98.4%', purgePropagation: '84ms', status: 'WARM' },
      { id: 'POP-EU-WEST', region: 'EUROPE', edgeHit: '99.4%', warmup: '96.2%', purgePropagation: '92ms', status: 'WARM' },
      { id: 'POP-AP-EAST', region: 'APAC', edgeHit: '98.9%', warmup: '92.8%', purgePropagation: '112ms', status: 'WARM' },
      { id: 'POP-SA-BRAZIL', region: 'LATAM', edgeHit: '97.4%', warmup: '88.6%', purgePropagation: '148ms', status: 'PRIMING' },
      { id: 'POP-AF-SOUTH', region: 'AFRICA', edgeHit: '96.8%', warmup: '84.2%', purgePropagation: '162ms', status: 'PRIMING' }
    ];

    function AetherMetricCockpit() {
      const [filterRegion, setFilterRegion] = useState('ALL');
      const [shieldOffload, setShieldOffload] = useState(99.4);
      const [warmupRatio, setWarmupRatio] = useState(94.2);
      const [cdnLogs, setCdnLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setShieldOffload(Number((99.1 + Math.random() * 0.7).toFixed(2)));
          setWarmupRatio(Number((93.5 + Math.random() * 1.5).toFixed(1)));

          const assets = ['/assets/chassis-telemetry.js', '/static/fonts/jetbrains-mono.woff2', '/api/v1/meta/config.json', '/edge/styles/cockpit.css'];
          const pops = ['POP-US-EAST', 'POP-EU-WEST', 'POP-AP-EAST', 'POP-SA-BRAZIL'];
          const statuses = ['HIT', 'HIT', 'WARMUP_PREFETCH', 'STALE_REVALIDATE'];
          const asset = assets[Math.floor(Math.random() * assets.length)];
          const pop = pops[Math.floor(Math.random() * pops.length)];
          const status = statuses[Math.floor(Math.random() * statuses.length)];
          const ttfb = (4.2 + Math.random() * 18.0).toFixed(1);

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            asset,
            pop,
            status,
            ttfb: `${ttfb}ms`
          };

          setCdnLogs(prev => [newLog, ...prev.slice(0, 6)]);
        }, 850);

        return () => clearInterval(interval);
      }, []);

      const filteredPops = filterRegion === 'ALL' ? CDN_POPS : CDN_POPS.filter(p => p.region === filterRegion);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER STATUS */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-AETHER-10</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    AETHER-METRIC <span className="text-xs text-[#FF9F0A] font-normal">// EDGE CDN CACHE WARMUP HEATMAP</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">ORIGIN SHIELD:</span>
                  <span className="text-green-400 font-bold">100% ISOLATED</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">PURGE CONVERGENCE:</span>
                  <span className="text-[#00F0FF] font-bold">&lt; 150ms GLOBAL</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS & POP HEATMAP */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">ORIGIN SHIELD OFFLOAD</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">BANDWIDTH SAVED</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{shieldOffload}%</span>
                      <span className="text-sm font-mono text-[#00F0FF]">OFFLOAD</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>ORIGIN HIT RATIO: {(100 - shieldOffload).toFixed(2)}%</span>
                      <span className="text-green-400 font-bold">SHIELD ACTIVE</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">GLOBAL WARMUP SATURATION</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">PRE-FETCH PRIMED</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{warmupRatio}%</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">PRIMED</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>GLOBAL POPS: 242 NODES</span>
                      <span className="text-green-400 font-bold">READY</span>
                    </div>
                  </div>
                </div>

                {/* CDN EDGE POP PERFORMANCE MATRIX */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      EDGE POP CACHE HEATMAP MATRIX
                    </h3>
                    <div className="flex gap-2">
                      {['ALL', 'NORTH-AMERICA', 'EUROPE', 'APAC', 'LATAM'].map((reg) => (
                        <button
                          key={reg}
                          onClick={() => setFilterRegion(reg)}
                          className={`px-3 py-1 rounded text-xs font-mono font-bold uppercase transition-colors ${
                            filterRegion === reg
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          {reg}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-400">
                          <th className="py-2 px-3">POP ID</th>
                          <th className="py-2 px-3">REGION</th>
                          <th className="py-2 px-3">EDGE HIT RATE</th>
                          <th className="py-2 px-3">WARMUP %</th>
                          <th className="py-2 px-3">PURGE TIME</th>
                          <th className="py-2 px-3 text-right">WARMUP STATE</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {filteredPops.map((pop) => (
                          <tr key={pop.id} className="hover:bg-[#1F2937]/30 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{pop.id}</td>
                            <td className="py-2.5 px-3 text-slate-400">{pop.region}</td>
                            <td className="py-2.5 px-3 text-green-400 font-bold">{pop.edgeHit}</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">{pop.warmup}</td>
                            <td className="py-2.5 px-3 text-slate-300">{pop.purgePropagation}</td>
                            <td className="py-2.5 px-3 text-right">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                pop.status === 'WARM' ? 'bg-green-500/10 text-green-400 border border-green-500/30' :
                                'bg-[#FF9F0A]/10 text-[#FF9F0A] border border-[#FF9F0A]/30'
                              }`}>
                                {pop.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: DEALERSHIP SPEC & LIVE EDGE ASSET STREAM */}
              <div className="space-y-6">

                {/* DEALERSHIP MONRONEY SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono text-[#00F0FF] font-bold tracking-widest uppercase">SPECIFICATION MONRONEY</span>
                    <h2 className="text-lg font-black text-white font-mono mt-1">GF-T2-AETHER-10</h2>
                    <p className="text-xs text-slate-400 font-sans">Track 2 Hypercar Flagship CDN Cockpit</p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">MODEL</span>
                      <span className="text-white font-bold">AETHER-METRIC</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE EDGE ACCESS LOG */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE EDGE ACCESS LOG
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">EDGE LOGS</span>
                  </div>

                  <div className="space-y-2">
                    {cdnLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold truncate max-w-[150px]">{log.asset}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-slate-400">{log.pop}</span>
                          <span className={`font-bold ${log.status === 'HIT' ? 'text-green-400' : 'text-[#FF9F0A]'}`}>
                            {log.status} ({log.ttfb})
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AetherMetricCockpit />);
  </script>
</body>
</html>
