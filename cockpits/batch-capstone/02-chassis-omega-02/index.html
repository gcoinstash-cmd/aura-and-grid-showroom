<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHASSIS-OMEGA-02 // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased select-none">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const INITIAL_SESSIONS = [
      { id: "SESS-PQC-8901", cipher: "ML-KEM-1024 / Dilithium-5", keySize: "1568 B", lat: "0.38ms", status: "VERIFIED", entropy: "256-bit" },
      { id: "SESS-PQC-8902", cipher: "FALCON-1024 / Kyber-768", keySize: "1280 B", lat: "0.41ms", status: "VERIFIED", entropy: "256-bit" },
      { id: "SESS-PQC-8903", cipher: "SPHINCS+ / SHA2-256s", keySize: "2976 B", lat: "0.74ms", status: "NOMINAL", entropy: "256-bit" },
      { id: "SESS-PQC-8904", cipher: "ML-KEM-768 / ECDSA-P384", keySize: "1184 B", lat: "0.32ms", status: "HYBRID_PASS", entropy: "256-bit" },
      { id: "SESS-PQC-8905", cipher: "NTRU-HPS-2048 / Falcon", keySize: "1424 B", lat: "0.45ms", status: "VERIFIED", entropy: "256-bit" }
    ];

    function PostQuantumTlsCockpit() {
      const [pulsePhase, setPulsePhase] = useState(0);
      const [handshakeRate, setHandshakeRate] = useState("24,840");
      const [sigLatency, setSigLatency] = useState("0.42");
      const [eventStream, setEventStream] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setPulsePhase(p => (p + 1) % 100);
          setHandshakeRate((24700 + Math.floor(Math.random() * 300)).toLocaleString());
          setSigLatency((0.39 + Math.random() * 0.06).toFixed(2));

          const newEvt = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            metric: 'ML-KEM-LATTICE-AGREEMENT',
            status: 'QUANTUM_PROOF',
            lat: (0.35 + Math.random() * 0.15).toFixed(2) + 'ms'
          };
          setEventStream(prev => [newEvt, ...prev.slice(0, 4)]);
        }, 1000);

        return () => clearInterval(interval);
      }, []);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#FF9F0A] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-OMEGA-02</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2 uppercase">
                    CHASSIS-OMEGA-02 <span className="text-xs text-[#00F0FF] font-normal">// Post-Quantum TLS Session Key Inspector</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">NIST PQC STANDARDS:</span>
                  <span className="text-green-400 font-bold">FIPS 203 / 204 ENFORCED</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">LATTICE DEPTH:</span>
                  <span className="text-[#00F0FF] font-bold">256-BIT SECURITY</span>
                </div>
              </div>
            </header>

            {/* MAIN GRID */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRIC CARDS, SVG VISUALIZER, DATA TABLE */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">KYBER-1024 / ML-KEM HANDSHAKES</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">LIVE KEM</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{handshakeRate}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">ops/s</span>
                    </div>
                    <div className="mt-4 text-xs font-mono text-slate-400">HARDWARE-ACCELERATED AVX-512 KEM</div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">DILITHIUM VERIFY LATENCY</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">SUB-MS P99</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{sigLatency}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">ms</span>
                    </div>
                    <div className="mt-4 text-xs font-mono text-slate-400">LWE (LEARNING WITH ERRORS) RESISTANT</div>
                  </div>
                </div>

                {/* ANIMATED SVG VISUALIZER */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#FF9F0A]" />
                      POST-QUANTUM LATTICE CRYPTOGRAPHY MATRIX // LIVE OSCILLOSCOPE
                    </h3>
                    <span className="text-xs font-mono text-[#FF9F0A]">MODULE-LATTICE 1024-D</span>
                  </div>

                  <div className="relative h-64 bg-[#05070B] rounded-lg border border-[#1F2937] flex items-center justify-center overflow-hidden">
                    <svg className="w-full h-full" viewBox="0 0 700 240" fill="none">
                      <defs>
                        <radialGradient id="quantum-glow" cx="50%" cy="50%" r="50%">
                          <stop offset="0%" stopColor="#00F0FF" stopOpacity="0.25" />
                          <stop offset="70%" stopColor="#FF9F0A" stopOpacity="0.08" />
                          <stop offset="100%" stopColor="#05070B" stopOpacity="0" />
                        </radialGradient>
                      </defs>
                      <rect width="100%" height="100%" fill="url(#quantum-glow)" />

                      {/* Concentric Lattice Orbits */}
                      <g transform="translate(350, 120)">
                        <circle r="95" stroke="#1F2937" strokeWidth="1" strokeDasharray="3,3" />
                        <circle r="70" stroke="#00F0FF" strokeWidth="1.2" strokeDasharray="8,4" strokeOpacity="0.6">
                          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
                        </circle>
                        <circle r="45" stroke="#FF9F0A" strokeWidth="1.5" strokeDasharray="6,6" strokeOpacity="0.8">
                          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
                        </circle>

                        {/* Central Lattice Core */}
                        <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="#0D1117" stroke="#00F0FF" strokeWidth="2" />
                        <circle r="6" fill="#FF9F0A" className="animate-pulse" />

                        {/* Vector Node Arms */}
                        <line x1="0" y1="-25" x2="0" y2="-70" stroke="#00F0FF" strokeWidth="1.5" strokeOpacity="0.7" />
                        <circle cx="0" cy="-70" r="4" fill="#00F0FF" />
                        <line x1="22" y1="12" x2="60" y2="35" stroke="#FF9F0A" strokeWidth="1.5" strokeOpacity="0.7" />
                        <circle cx="60" cy="35" r="4" fill="#FF9F0A" />
                        <line x1="-22" y1="12" x2="-60" y2="35" stroke="#00F0FF" strokeWidth="1.5" strokeOpacity="0.7" />
                        <circle cx="-60" cy="35" r="4" fill="#00F0FF" />
                      </g>

                      {/* Cryptographic Waveforms */}
                      <path d="M 40 180 Q 90 140, 140 180 T 240 180" stroke="#00F0FF" strokeWidth="1.5" fill="none" opacity="0.4" />
                      <path d="M 460 180 Q 510 210, 560 180 T 660 180" stroke="#FF9F0A" strokeWidth="1.5" fill="none" opacity="0.4" />
                      <text x="60" y="50" fill="#64748B" fontSize="11" fontFamily="JetBrains Mono">POLYNOMIAL RING: Z_q[X]/(X^256 + 1)</text>
                      <text x="500" y="50" fill="#64748B" fontSize="11" fontFamily="JetBrains Mono">SHOR-RESISTANT: OK</text>
                    </svg>
                  </div>
                </div>

                {/* SESSIONS TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center mb-1">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider">
                      ACTIVE QUANTUM-HARDENED TLS SESSIONS
                    </h4>
                    <span className="text-xs font-mono text-green-400">ZERO COMPROMISE</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-500">
                          <th className="pb-2">SESSION ID</th>
                          <th className="pb-2">POST-QUANTUM CIPHER SUITE</th>
                          <th className="pb-2">PUBLIC KEY</th>
                          <th className="pb-2">HANDSHAKE</th>
                          <th className="pb-2 text-right">SECURITY STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {INITIAL_SESSIONS.map(sess => (
                          <tr key={sess.id} className="hover:bg-white/[0.02]">
                            <td className="py-2.5 font-bold text-white">{sess.id}</td>
                            <td className="py-2.5 text-slate-300">{sess.cipher}</td>
                            <td className="py-2.5 text-[#00F0FF]">{sess.keySize}</td>
                            <td className="py-2.5 text-green-400">{sess.lat}</td>
                            <td className="py-2.5 text-right font-bold text-[#FF9F0A]">{sess.status}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT 1 COLUMN: COMMERCIAL PROVENANCE & REALTIME EVENT STREAM */}
              <div className="space-y-6">

                {/* COMMERCIAL PROVENANCE CARD */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-24 h-24 bg-[#FF9F0A]/5 rounded-full blur-2xl pointer-events-none" />

                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold text-[#FF9F0A] uppercase tracking-widest">COMMERCIAL SPECIFICATION</span>
                    <h3 className="text-base font-mono font-black text-white mt-0.5">APA ASSET ACQUISITION</h3>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL CTAS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE EVENT FEED */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#FF9F0A] animate-ping" />
                      LIVE TELEMETRY FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">REALTIME</span>
                  </div>

                  <div className="space-y-2">
                    {eventStream.map((evt) => (
                      <div key={evt.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{evt.metric}</span>
                          <span className="text-slate-500">{evt.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-[#00F0FF]">{evt.status}</span>
                          <span className="text-green-400 font-bold">{evt.lat}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PostQuantumTlsCockpit />);
  </script>
</body>
</html>
