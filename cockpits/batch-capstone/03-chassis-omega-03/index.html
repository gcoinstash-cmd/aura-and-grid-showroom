<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHASSIS-OMEGA-03 // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased select-none">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const INITIAL_PARTITIONS = [
      { id: "PART-STREAM-00", topic: "telemetry.f1.avionics", rate: "1,420,000 evt/s", lag: "0.00ms", fill: 18, status: "CLEAR" },
      { id: "PART-STREAM-01", topic: "telemetry.f1.powertrain", rate: "1,850,000 evt/s", lag: "0.00ms", fill: 24, status: "CLEAR" },
      { id: "PART-STREAM-02", topic: "telemetry.f1.haptics", rate: "1,120,000 evt/s", lag: "0.01ms", fill: 14, status: "CLEAR" },
      { id: "PART-STREAM-03", topic: "quant.lob.orders", rate: "2,460,000 evt/s", lag: "0.00ms", fill: 32, status: "BURST" },
      { id: "PART-STREAM-04", topic: "consensus.raft.commit", rate: "1,670,000 evt/s", lag: "0.00ms", fill: 21, status: "CLEAR" }
    ];

    function EventBusTachometerCockpit() {
      const [pulsePhase, setPulsePhase] = useState(0);
      const [ingestionRate, setIngestionRate] = useState("8.52");
      const [bufferFill, setBufferFill] = useState("14.2");
      const [eventStream, setEventStream] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setPulsePhase(p => (p + 1) % 100);
          setIngestionRate((8.45 + Math.random() * 0.22).toFixed(2));
          setBufferFill((13.8 + Math.random() * 0.9).toFixed(1));

          const newEvt = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            metric: 'ZERO-COPY-DISPATCH',
            status: 'DRAINED',
            lat: (0.012 + Math.random() * 0.008).toFixed(3) + 'ms'
          };
          setEventStream(prev => [newEvt, ...prev.slice(0, 4)]);
        }, 1000);

        return () => clearInterval(interval);
      }, []);

      // Calculate tachometer needle angle [-120deg to +120deg]
      const needleAngle = -120 + ((parseFloat(ingestionRate) - 7.0) / 3.0) * 240;

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-OMEGA-03</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2 uppercase">
                    CHASSIS-OMEGA-03 <span className="text-xs text-[#FF9F0A] font-normal">// Distributed Event-Bus Ingestion Tachometer</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">RINGBUFFER:</span>
                  <span className="text-green-400 font-bold">LMAX DISRUPTOR 64K</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">CONSUMER LAG:</span>
                  <span className="text-[#00F0FF] font-bold">0.00 MS FLAT</span>
                </div>
              </div>
            </header>

            {/* MAIN GRID */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRIC CARDS, SVG TACHOMETER, DATA TABLE */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">EVENT INGESTION VELOCITY</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">HIGH-REV RPM</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{ingestionRate}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">M evt/s</span>
                    </div>
                    <div className="mt-4 text-xs font-mono text-slate-400">ZERO-COPY SHARED MEMORY IPC</div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">RINGBUFFER HEADROOM PRESSURE</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">OPTIMAL</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{bufferFill}%</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">PRESSURE</span>
                    </div>
                    <div className="mt-4 text-xs font-mono text-slate-400">85.8% REMAINING INGESTION BUFFER</div>
                  </div>
                </div>

                {/* ANIMATED SVG TACHOMETER VISUALIZER */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      EVENT INGESTION TACHOMETER // F1 PIT WALL TELEMETRY DIAL
                    </h3>
                    <span className="text-xs font-mono text-[#FF9F0A]">REDLINE @ 10.0M EVT/S</span>
                  </div>

                  <div className="relative h-64 bg-[#05070B] rounded-lg border border-[#1F2937] flex items-center justify-center overflow-hidden">
                    <svg className="w-full h-full" viewBox="0 0 700 240" fill="none">
                      {/* Tachometer Arc */}
                      <g transform="translate(350, 160)">
                        {/* Background Dial Arc */}
                        <path d="M -160 0 A 160 160 0 1 1 160 0" stroke="#1F2937" strokeWidth="16" fill="none" strokeLinecap="round" />
                        
                        {/* Safe Zone Arc (Cyan) */}
                        <path d="M -160 0 A 160 160 0 0 1 80 -138" stroke="#00F0FF" strokeWidth="16" fill="none" strokeOpacity="0.7" strokeDasharray="3,6" />
                        
                        {/* Redline Zone Arc (Amber/Red) */}
                        <path d="M 80 -138 A 160 160 0 0 1 160 0" stroke="#FF9F0A" strokeWidth="16" fill="none" strokeOpacity="0.9" />

                        {/* Dial Tick Marks */}
                        {[-120, -90, -60, -30, 0, 30, 60, 90, 120].map((deg, idx) => {
                          const rad = (deg - 90) * Math.PI / 180;
                          const x1 = Math.cos(rad) * 135;
                          const y1 = Math.sin(rad) * 135;
                          const x2 = Math.cos(rad) * 148;
                          const y2 = Math.sin(rad) * 148;
                          return (
                            <line key={idx} x1={x1} y1={y1} x2={x2} y2={y2} stroke={deg > 60 ? "#FF9F0A" : "#94A3B8"} strokeWidth="2" />
                          );
                        })}

                        {/* Center Hub */}
                        <circle r="18" fill="#0D1117" stroke="#00F0FF" strokeWidth="3" />
                        <circle r="7" fill="#FF9F0A" />

                        {/* Dynamic Tachometer Needle */}
                        <g transform={`rotate(${needleAngle})`}>
                          <line x1="0" y1="0" x2="0" y2="-140" stroke="#FF9F0A" strokeWidth="3.5" strokeLinecap="round" />
                          <circle cx="0" cy="-140" r="4" fill="#FFFFFF" />
                        </g>

                        {/* Readout Text */}
                        <text y="-40" fill="#FFFFFF" fontSize="24" fontWeight="bold" fontFamily="JetBrains Mono" textAnchor="middle">{ingestionRate} M/s</text>
                        <text y="-18" fill="#64748B" fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle">VELOCITY</text>
                      </g>
                    </svg>
                  </div>
                </div>

                {/* PARTITIONS TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center mb-1">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider">
                      ZERO-COPY PARTITION TOPOLOGY
                    </h4>
                    <span className="text-xs font-mono text-green-400">DRAIN LAG: 0.00 MS</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-500">
                          <th className="pb-2">PARTITION ID</th>
                          <th className="pb-2">INGESTION TOPIC</th>
                          <th className="pb-2">THROUGHPUT</th>
                          <th className="pb-2">QUEUE LAG</th>
                          <th className="pb-2 text-right">RING BUFFER</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {INITIAL_PARTITIONS.map(part => (
                          <tr key={part.id} className="hover:bg-white/[0.02]">
                            <td className="py-2.5 font-bold text-white">{part.id}</td>
                            <td className="py-2.5 text-slate-400">{part.topic}</td>
                            <td className="py-2.5 text-[#00F0FF]">{part.rate}</td>
                            <td className="py-2.5 text-green-400">{part.lag}</td>
                            <td className="py-2.5 text-right font-bold text-slate-300">{part.fill}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT 1 COLUMN: COMMERCIAL PROVENANCE & REALTIME EVENT STREAM */}
              <div className="space-y-6">

                {/* COMMERCIAL PROVENANCE CARD */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-24 h-24 bg-[#00F0FF]/5 rounded-full blur-2xl pointer-events-none" />

                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold text-[#00F0FF] uppercase tracking-widest">COMMERCIAL SPECIFICATION</span>
                    <h3 className="text-base font-mono font-black text-white mt-0.5">APA ASSET ACQUISITION</h3>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL CTAS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE EVENT FEED */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE TELEMETRY FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">REALTIME</span>
                  </div>

                  <div className="space-y-2">
                    {eventStream.map((evt) => (
                      <div key={evt.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{evt.metric}</span>
                          <span className="text-slate-500">{evt.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-[#00F0FF]">{evt.status}</span>
                          <span className="text-green-400 font-bold">{evt.lat}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EventBusTachometerCockpit />);
  </script>
</body>
</html>
