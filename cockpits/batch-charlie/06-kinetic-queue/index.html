<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINETIC-QUEUE // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const INITIAL_QUEUES = [
      { name: 'orders.checkout.v1', depth: 420, inRate: '3,450/s', outRate: '3,448/s', lagMs: '12ms', status: 'HEALTHY' },
      { name: 'webhooks.outbound', depth: 1840, inRate: '820/s', outRate: '805/s', lagMs: '95ms', status: 'HEALTHY' },
      { name: 'media.video.transcode', depth: 124, inRate: '45/s', outRate: '42/s', lagMs: '1,420ms', status: 'BACKPRESSURE' },
      { name: 'notifications.sms', depth: 18, inRate: '120/s', outRate: '120/s', lagMs: '4ms', status: 'HEALTHY' },
      { name: 'orders.deadletter.dlq', depth: 34, inRate: '0/s', outRate: '0/s', lagMs: 'QUARANTINE', status: 'POISON_PILL' }
    ];

    function KineticQueueCockpit() {
      const [queues, setQueues] = useState(INITIAL_QUEUES);
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [totalThroughput, setTotalThroughput] = useState(4820);
      const [dlqCount, setDlqCount] = useState(34);
      const [queueLogs, setQueueLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setTotalThroughput(prev => prev + Math.floor((Math.random() - 0.5) * 120));

          const queueNames = ['orders.checkout.v1', 'webhooks.outbound', 'media.video.transcode', 'notifications.sms'];
          const actions = ['MSG_ACKNOWLEDGED', 'MSG_ENQUEUED', 'PREFETCH_SATURATED', 'BATCH_COMMITTED', 'DEADLETTER_ROUTED'];

          const q = queueNames[Math.floor(Math.random() * queueNames.length)];
          const act = actions[Math.floor(Math.random() * actions.length)];

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            q,
            act,
            isDlq: act.includes('DEADLETTER')
          };

          setQueueLogs(prev => [newLog, ...prev.slice(0, 5)]);
        }, 850);

        return () => clearInterval(interval);
      }, []);

      const replayDlq = () => {
        setDlqCount(0);
        setQueues(prev => prev.map(q => q.name.includes('dlq') ? { ...q, depth: 0, status: 'HEALTHY' } : q));
      };

      const filteredQueues = filterStatus === 'ALL'
        ? queues
        : queues.filter(q => q.status === filterStatus);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-KINETIC-06</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    KINETIC-QUEUE <span className="text-xs text-[#FF9F0A] font-normal">// BACKPRESSURE & DEAD-LETTER GAUGE</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">BROKER:</span>
                  <span className="text-green-400 font-bold">RABBITMQ / SQS CLUSTER</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">PREFETCH:</span>
                  <span className="text-[#00F0FF] font-bold">AUTO-THROTTLED</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, CONSUMER PRESSURE, QUEUE TABLE */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">AGGREGATE DISPATCH VELOCITY</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">CONSUMER FLOW</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{totalThroughput.toLocaleString()}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">msg/sec</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>ACK RATIO: 99.98%</span>
                      <span className="text-green-400">ZERO SATURATION</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">DEAD-LETTER QUARANTINE</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">POISON ISOLATED</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{dlqCount}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">items</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>MAX RETRIES: 5 EXCEEDED</span>
                      <button onClick={replayDlq} className="text-[#FF9F0A] hover:underline font-bold">
                        ⚡ REPLAY ALL DLQ
                      </button>
                    </div>
                  </div>
                </div>

                {/* ANIMATED BACKPRESSURE SATURATION GAUGE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      CONSUMER GROUP LAG & BACKPRESSURE HORIZON
                    </h3>
                    <span className="text-xs font-mono text-green-400">DRAIN RATE OPTIMAL</span>
                  </div>

                  <div className="bg-[#05070B] border border-[#1F2937] p-5 rounded-xl space-y-4">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="text-slate-400">PIPELINE SATURATION GAUGE</span>
                      <span className="text-[#00F0FF] font-bold">28.4% (GREEN ZONE)</span>
                    </div>

                    <div className="w-full h-4 bg-[#0D1117] rounded-full border border-[#1F2937] overflow-hidden p-0.5">
                      <div className="h-full bg-gradient-to-r from-green-400 via-[#00F0FF] to-[#FF9F0A] rounded-full w-[28.4%]" />
                    </div>

                    <div className="flex justify-between text-[10px] font-mono text-slate-500">
                      <span>0% IDLE</span>
                      <span>50% NOMINAL LOAD</span>
                      <span>80% BACKPRESSURE WARNING</span>
                      <span>100% BUFFER OVERFLOW</span>
                    </div>
                  </div>
                </div>

                {/* QUEUE BROKER TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      TOPIC / QUEUE DIRECTORY ({filteredQueues.length})
                    </h3>
                    <div className="flex gap-1 text-xs font-mono">
                      {['ALL', 'HEALTHY', 'BACKPRESSURE', 'POISON_PILL'].map(st => (
                        <button
                          key={st}
                          onClick={() => setFilterStatus(st)}
                          className={`px-2.5 py-1 rounded text-[11px] font-bold transition-colors ${
                            filterStatus === st
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#05070B] text-slate-400 hover:text-white border border-[#1F2937]'
                          }`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-[#05070B] text-slate-400 border-b border-[#1F2937]">
                        <tr>
                          <th className="py-2.5 px-3">QUEUE TOPIC</th>
                          <th className="py-2.5 px-3">DEPTH</th>
                          <th className="py-2.5 px-3">PUBLISH RATE</th>
                          <th className="py-2.5 px-3">ACK RATE</th>
                          <th className="py-2.5 px-3">LAG</th>
                          <th className="py-2.5 px-3">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/60">
                        {filteredQueues.map(q => (
                          <tr key={q.name} className="hover:bg-[#05070B]/50 transition-colors">
                            <td className="py-2.5 px-3 text-white font-bold">{q.name}</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">{q.depth.toLocaleString()}</td>
                            <td className="py-2.5 px-3 text-[#00F0FF]">{q.inRate}</td>
                            <td className="py-2.5 px-3 text-slate-300">{q.outRate}</td>
                            <td className="py-2.5 px-3 text-slate-400">{q.lagMs}</td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                q.status === 'HEALTHY' ? 'bg-green-500/10 text-green-400 border-green-500/30' :
                                q.status === 'BACKPRESSURE' ? 'bg-[#FF9F0A]/10 text-[#FF9F0A] border-[#FF9F0A]/30' :
                                'bg-red-500/10 text-red-400 border-red-500/30'
                              }`}>
                                {q.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: MONRONEY SPEC CARD & QUEUE LOG */}
              <div className="space-y-6">

                {/* TRACK 2 MONRONEY COMMERCIAL SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">DEALERSHIP MONRONEY SPEC</span>
                    <h3 className="text-lg font-black font-mono text-white">KINETIC-QUEUE</h3>
                    <p className="text-xs text-slate-400">RabbitMQ/SQS Backpressure & Dead-Letter Gauge</p>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">CHASSIS ID</span>
                      <span className="text-white font-bold">GF-T2-KINETIC-06</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE QUEUE BROKER FEED */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE MESSAGE BROKER FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">EVENT DISPATCH</span>
                  </div>

                  <div className="space-y-2">
                    {queueLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{log.q}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span className={`font-bold ${log.isDlq ? 'text-red-400' : 'text-green-400'}`}>
                            {log.act}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<KineticQueueCockpit />);
  </script>
</body>
</html>
