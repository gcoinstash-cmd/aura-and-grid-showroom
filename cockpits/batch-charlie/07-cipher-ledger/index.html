<!DOCTYPE html>
<html lang="en">

<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const INITIAL_BLOCKS = [
      { height: 84915, hash: '0x9fa1...48b2', prevHash: '0x3dc4...119a', txs: 148, signer: 'auditor-node-01', status: 'COMMITTED' },
      { height: 84914, hash: '0x3dc4...119a', prevHash: '0xee81...77fa', txs: 92, signer: 'auditor-node-03', status: 'COMMITTED' },
      { height: 84913, hash: '0xee81...77fa', prevHash: '0x10b2...99ca', txs: 215, signer: 'auditor-node-02', status: 'COMMITTED' },
      { height: 84912, hash: '0x10b2...99ca', prevHash: '0x88f4...55dc', txs: 84, signer: 'auditor-node-01', status: 'COMMITTED' },
      { height: 84911, hash: '0x88f4...55dc', prevHash: '0x44a1...2288', txs: 130, signer: 'auditor-node-04', status: 'COMMITTED' }
    ];

    function CipherLedgerCockpit() {
      const [blocks, setBlocks] = useState(INITIAL_BLOCKS);
      const [blockHeight, setBlockHeight] = useState(84915);
      const [totalTxs, setTotalTxs] = useState(1482094);
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [ledgerLogs, setLedgerLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setTotalTxs(prev => prev + Math.floor(Math.random() * 8) + 2);

          const actions = [
            'APPEND_TX: APA_TITLE_TRANSFER',
            'MERKLE_ROOT_RECALCULATED',
            'HASH_CHAIN_VALIDATED (SHA-256)',
            'ED25519_SIG_VERIFIED',
            'AUDIT_RECORD_SEALED'
          ];
          const act = actions[Math.floor(Math.random() * actions.length)];

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            act
          };

          setLedgerLogs(prev => [newLog, ...prev.slice(0, 5)]);
        }, 900);

        return () => clearInterval(interval);
      }, []);

      const appendBlock = () => {
        const newHeight = blockHeight + 1;
        setBlockHeight(newHeight);
        const newBlock = {
          height: newHeight,
          hash: '0x' + Math.random().toString(16).substring(2, 6) + '...' + Math.random().toString(16).substring(2, 6),
          prevHash: blocks[0].hash,
          txs: Math.floor(Math.random() * 80) + 40,
          signer: 'auditor-node-01',
          status: 'COMMITTED'
        };
        setBlocks(prev => [newBlock, ...prev.slice(0, 4)]);
      };

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-CIPHER-07</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    CIPHER-LEDGER <span className="text-xs text-[#FF9F0A] font-normal">// IMMUTABLE APPEND-ONLY AUDIT TRAIL</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">CRYPTOGRAPHY:</span>
                  <span className="text-green-400 font-bold">SHA-256 + ED25519</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">INTEGRITY:</span>
                  <span className="text-[#00F0FF] font-bold">TAMPER-EVIDENT</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, MERKLE PROOF, BLOCK TABLE */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">LEDGER BLOCK HEIGHT</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">FINALIZED</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">#{blockHeight.toLocaleString()}</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>ENTROPY: 256-BIT</span>
                      <span className="text-green-400">CHAIN 100% VALID</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">CUMULATIVE AUDIT TRANSACTIONS</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">IMMUTABLE</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{totalTxs.toLocaleString()}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">txs</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>TAMPER AUDIT: PASSED</span>
                      <button onClick={appendBlock} className="text-[#FF9F0A] hover:underline font-bold">
                        ⚡ MINE AUDIT BLOCK
                      </button>
                    </div>
                  </div>
                </div>

                {/* ANIMATED MERKLE TREE HASH CHAIN VISUALIZER */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      SHA-256 APPEND-ONLY CHAIN CONTINUITY
                    </h3>
                    <span className="text-xs font-mono text-green-400">MERKLE ROOT VERIFIED</span>
                  </div>

                  <div className="bg-[#05070B] border border-[#1F2937] p-5 rounded-xl flex items-center justify-between gap-2 overflow-x-auto">
                    {blocks.slice(0, 4).reverse().map((b, idx) => (
                      <div key={b.height} className="flex items-center gap-2 shrink-0">
                        <div className="p-3 rounded-lg bg-[#0D1117] border border-[#00F0FF]/40 text-center w-36 space-y-1">
                          <div className="text-[10px] font-mono text-[#FF9F0A] font-bold">BLOCK #{b.height}</div>
                          <div className="text-xs font-mono text-white font-bold">{b.hash}</div>
                          <div className="text-[9px] font-mono text-slate-400">{b.txs} transactions</div>
                        </div>
                        {idx < 3 && (
                          <div className="text-[#00F0FF] font-bold text-sm">→</div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {/* BLOCK LEDGER TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      APPEND-ONLY BLOCK INVENTORY ({blocks.length})
                    </h3>
                    <span className="text-xs font-mono text-slate-400">NON-REPUDIABLE</span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-[#05070B] text-slate-400 border-b border-[#1F2937]">
                        <tr>
                          <th className="py-2.5 px-3">HEIGHT</th>
                          <th className="py-2.5 px-3">BLOCK HASH</th>
                          <th className="py-2.5 px-3">PREV HASH</th>
                          <th className="py-2.5 px-3">TX COUNT</th>
                          <th className="py-2.5 px-3">SIGNER</th>
                          <th className="py-2.5 px-3">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/60">
                        {blocks.map(b => (
                          <tr key={b.height} className="hover:bg-[#05070B]/50 transition-colors">
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">#{b.height}</td>
                            <td className="py-2.5 px-3 text-[#00F0FF]">{b.hash}</td>
                            <td className="py-2.5 px-3 text-slate-400">{b.prevHash}</td>
                            <td className="py-2.5 px-3 text-white font-bold">{b.txs}</td>
                            <td className="py-2.5 px-3 text-slate-300">{b.signer}</td>
                            <td className="py-2.5 px-3">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/30">
                                {b.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: MONRONEY SPEC CARD & AUDIT LOG */}
              <div className="space-y-6">

                {/* TRACK 2 MONRONEY COMMERCIAL SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">DEALERSHIP MONRONEY SPEC</span>
                    <h3 className="text-lg font-black font-mono text-white">CIPHER-LEDGER</h3>
                    <p className="text-xs text-slate-400">Immutable Append-Only Audit Trail Cockpit</p>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">CHASSIS ID</span>
                      <span className="text-white font-bold">GF-T2-CIPHER-07</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE AUDIT STREAM */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE APPEND AUDIT STREAM
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">SEALED ENTRIES</span>
                  </div>

                  <div className="space-y-2">
                    {ledgerLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{log.act}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="text-green-400 text-[10px]">
                          ✓ SHA-256 SIGNATURE VALIDATED
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CipherLedgerCockpit />);
  </script>
</body>
</html>
