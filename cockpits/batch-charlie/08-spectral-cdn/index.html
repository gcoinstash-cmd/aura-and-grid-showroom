<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPECTRAL-CDN // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const EDGE_POPS = [
      { code: 'IAD-01', metro: 'Ashburn, VA', bgpAsn: 'AS13335', hitRatio: '99.1%', rtt: '1.8ms', egress: '64.2 Gbps', status: 'OPTIMAL' },
      { code: 'LHR-02', metro: 'London, UK', bgpAsn: 'AS13335', hitRatio: '98.4%', rtt: '3.2ms', egress: '51.8 Gbps', status: 'OPTIMAL' },
      { code: 'FRA-03', metro: 'Frankfurt, DE', bgpAsn: 'AS13335', hitRatio: '98.8%', rtt: '4.1ms', egress: '44.0 Gbps', status: 'OPTIMAL' },
      { code: 'NRT-04', metro: 'Tokyo, JP', bgpAsn: 'AS13335', hitRatio: '97.6%', rtt: '7.8ms', egress: '38.5 Gbps', status: 'NOMINAL' },
      { code: 'SYD-05', metro: 'Sydney, AU', bgpAsn: 'AS13335', hitRatio: '96.9%', rtt: '14.2ms', egress: '22.1 Gbps', status: 'NOMINAL' }
    ];

    function SpectralCdnCockpit() {
      const [cacheHitRatio, setCacheHitRatio] = useState(98.6);
      const [bandwidthTbps, setBandwidthTbps] = useState(4.28);
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [routingLogs, setRoutingLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setCacheHitRatio(Number((98.4 + Math.random() * 0.4).toFixed(2)));
          setBandwidthTbps(Number((4.2 + Math.random() * 0.3).toFixed(2)));

          const pops = ['IAD-01', 'LHR-02', 'FRA-03', 'NRT-04', 'SYD-05'];
          const actions = ['ANYCAST_ROUTE_OPTIMIZED', 'BGP_MED_UPDATED', '0-RTT_HANDSHAKE_RESUMED', 'ORIGIN_FETCH_SHIELDED', 'EDGE_CACHE_HIT'];

          const pop = pops[Math.floor(Math.random() * pops.length)];
          const act = actions[Math.floor(Math.random() * actions.length)];

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            pop,
            act
          };

          setRoutingLogs(prev => [newLog, ...prev.slice(0, 5)]);
        }, 850);

        return () => clearInterval(interval);
      }, []);

      const purgeEdgeCache = () => {
        setCacheHitRatio(92.0);
      };

      const filteredPops = filterStatus === 'ALL'
        ? EDGE_POPS
        : EDGE_POPS.filter(p => p.status === filterStatus);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-SPECTRAL-08</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    SPECTRAL-CDN <span className="text-xs text-[#FF9F0A] font-normal">// ANYCAST POINT-OF-PRESENCE ROUTING</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">ROUTING:</span>
                  <span className="text-green-400 font-bold">BGP ANYCAST GLOBAL</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">TLS 1.3:</span>
                  <span className="text-[#00F0FF] font-bold">0-RTT RESUMPTION</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, POP MAP, POPS TABLE */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">GLOBAL EDGE CACHE HIT RATIO</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">ORIGIN SHIELDED</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{cacheHitRatio}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">%</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>ORIGIN LOAD: 1.4%</span>
                      <span className="text-green-400">TIER-1 BYPASS</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">AGGREGATE EDGE EGRESS</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">LINE RATE</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{bandwidthTbps}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">Tbps</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>BGP HOPS: 1.2 AVG</span>
                      <button onClick={purgeEdgeCache} className="text-[#FF9F0A] hover:underline font-bold">
                        ⚡ PURGE POP CACHE
                      </button>
                    </div>
                  </div>
                </div>

                {/* ANIMATED ANYCAST POP WORLD MESH */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      GLOBAL POINT-OF-PRESENCE LATENCY HEATMAP
                    </h3>
                    <span className="text-xs font-mono text-green-400">ALL POPS ONLINE</span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 bg-[#05070B] border border-[#1F2937] p-5 rounded-xl">
                    {EDGE_POPS.map(p => (
                      <div key={p.code} className="p-3 rounded-lg bg-[#0D1117] border border-[#1F2937] text-center space-y-1">
                        <div className="w-2 h-2 rounded-full bg-green-400 mx-auto" />
                        <div className="text-xs font-mono text-white font-bold">{p.code}</div>
                        <div className="text-[10px] text-slate-400 truncate">{p.metro.split(',')[0]}</div>
                        <div className="text-[11px] font-mono text-[#00F0FF] font-bold">{p.rtt}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* EDGE POP TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      ANYCAST POP DIRECTORY ({filteredPops.length})
                    </h3>
                    <div className="flex gap-1 text-xs font-mono">
                      {['ALL', 'OPTIMAL', 'NOMINAL'].map(st => (
                        <button
                          key={st}
                          onClick={() => setFilterStatus(st)}
                          className={`px-2.5 py-1 rounded text-[11px] font-bold transition-colors ${
                            filterStatus === st
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#05070B] text-slate-400 hover:text-white border border-[#1F2937]'
                          }`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-[#05070B] text-slate-400 border-b border-[#1F2937]">
                        <tr>
                          <th className="py-2.5 px-3">POP CODE</th>
                          <th className="py-2.5 px-3">METRO LOCATION</th>
                          <th className="py-2.5 px-3">BGP ASN</th>
                          <th className="py-2.5 px-3">HIT RATIO</th>
                          <th className="py-2.5 px-3">RTT</th>
                          <th className="py-2.5 px-3">EGRESS</th>
                          <th className="py-2.5 px-3">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/60">
                        {filteredPops.map(p => (
                          <tr key={p.code} className="hover:bg-[#05070B]/50 transition-colors">
                            <td className="py-2.5 px-3 text-white font-bold">{p.code}</td>
                            <td className="py-2.5 px-3 text-slate-300">{p.metro}</td>
                            <td className="py-2.5 px-3 text-slate-400">{p.bgpAsn}</td>
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{p.hitRatio}</td>
                            <td className="py-2.5 px-3 text-green-400">{p.rtt}</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A]">{p.egress}</td>
                            <td className="py-2.5 px-3">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/30">
                                {p.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: MONRONEY SPEC CARD & ROUTING LOG */}
              <div className="space-y-6">

                {/* TRACK 2 MONRONEY COMMERCIAL SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">DEALERSHIP MONRONEY SPEC</span>
                    <h3 className="text-lg font-black font-mono text-white">SPECTRAL-CDN</h3>
                    <p className="text-xs text-slate-400">Anycast Edge Point-of-Presence Routing Map</p>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">CHASSIS ID</span>
                      <span className="text-white font-bold">GF-T2-SPECTRAL-08</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE BGP ROUTING LOG */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE ANYCAST ROUTING FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">BGP FEED</span>
                  </div>

                  <div className="space-y-2">
                    {routingLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{log.pop}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="text-[#00F0FF] text-[10px]">
                          {log.act}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SpectralCdnCockpit />);
  </script>
</body>
</html>
