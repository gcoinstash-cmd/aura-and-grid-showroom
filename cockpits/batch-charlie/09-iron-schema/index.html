<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRON-SCHEMA // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const INITIAL_REVISIONS = [
      { rev: 'REV-0881', name: 'add_gin_trgm_index_on_assets', table: 'fleet_assets', progress: '100%', duration: '4.2s', status: 'APPLIED' },
      { rev: 'REV-0882', name: 'backfill_cluster_partition_keys', table: 'telemetry_stream', progress: '84%', duration: '18.4s', status: 'EXECUTING' },
      { rev: 'REV-0883', name: 'atomic_column_swap_title_hash', table: 'ledger_entries', progress: '0%', duration: 'PENDING', status: 'QUEUED' },
      { rev: 'REV-0884', name: 'foreign_key_validate_not_valid', table: 'orders_v2', progress: '0%', duration: 'PENDING', status: 'QUEUED' }
    ];

    function IronSchemaCockpit() {
      const [revisions, setRevisions] = useState(INITIAL_REVISIONS);
      const [migrationPhase, setMigrationPhase] = useState('3. DUAL-WRITE MIRRORING');
      const [lockWaitMs, setLockWaitMs] = useState(0.4);
      const [backfillPct, setBackfillPct] = useState(84);
      const [ddlLogs, setDdlLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setLockWaitMs(Number((0.3 + Math.random() * 0.3).toFixed(2)));
          setBackfillPct(prev => (prev >= 100 ? 100 : prev + 1));

          const actions = [
            'READ_REPLICA_LAG_NORMAL (1.2ms)',
            'SHADOW_TABLE_CHUNK_COPIED (10k rows)',
            'LOCK_TIMEOUT_GUARD_SAFE (<100ms)',
            'CHANGE_DATA_CAPTURE_STREAMING',
            'ATOMIC_LOCK_ACQUIRED_FOR_SWAP'
          ];
          const act = actions[Math.floor(Math.random() * actions.length)];

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            act
          };

          setDdlLogs(prev => [newLog, ...prev.slice(0, 5)]);
        }, 900);

        return () => clearInterval(interval);
      }, []);

      const simulateSwap = () => {
        setBackfillPct(100);
        setMigrationPhase('4. ATOMIC SWAP (COMPLETE)');
        setRevisions(prev => prev.map(r => r.rev === 'REV-0882' ? { ...r, progress: '100%', status: 'APPLIED' } : r));
      };

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-IRON-09</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    IRON-SCHEMA <span className="text-xs text-[#FF9F0A] font-normal">// DATABASE MIGRATION LOCK & DDL TIMELINE</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">ENGINE:</span>
                  <span className="text-green-400 font-bold">ONLINE DDL (ZERO-LOCK)</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">ACCESS EXCLUSIVE:</span>
                  <span className="text-[#00F0FF] font-bold">SHIELDED (&lt;2ms)</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, PHASING TIMELINE, REVISIONS */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">MAX EXCLUSIVE LOCK HOLD</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">ZERO DOWNTIME</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{lockWaitMs}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">ms</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>LOCK TIMEOUT: 500ms SLA</span>
                      <span className="text-green-400">ZERO ABORTS</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">ROW BACKFILL SATURATION</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">THROTTLED CHUNKS</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{backfillPct}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">%</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>PHASE: {migrationPhase}</span>
                      <button onClick={simulateSwap} className="text-[#FF9F0A] hover:underline font-bold">
                        ⚡ TRIGGER ATOMIC SWAP
                      </button>
                    </div>
                  </div>
                </div>

                {/* ANIMATED ZERO-DOWNTIME DDL TIMELINE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      ONLINE DDL STAGED EXECUTION PIPELINE
                    </h3>
                    <span className="text-xs font-mono text-[#00F0FF]">NON-BLOCKING</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 bg-[#05070B] border border-[#1F2937] p-5 rounded-xl">
                    <div className="p-3 rounded-lg bg-[#0D1117] border border-green-500/40 text-center space-y-1">
                      <div className="text-[10px] font-mono text-green-400 font-bold">STAGE 1: SHADOW</div>
                      <div className="text-xs font-mono text-white font-bold">CREATE TABLE _new</div>
                      <div className="text-[9px] text-slate-400">Duration: 12ms</div>
                    </div>

                    <div className="p-3 rounded-lg bg-[#0D1117] border border-green-500/40 text-center space-y-1">
                      <div className="text-[10px] font-mono text-green-400 font-bold">STAGE 2: BACKFILL</div>
                      <div className="text-xs font-mono text-white font-bold">CHUNK COPY ROWS</div>
                      <div className="text-[9px] text-slate-400">10k Rows/chunk</div>
                    </div>

                    <div className="p-3 rounded-lg bg-[#0D1117] border border-[#00F0FF]/40 text-center space-y-1">
                      <div className="text-[10px] font-mono text-[#00F0FF] font-bold">STAGE 3: DUAL-WRITE</div>
                      <div className="text-xs font-mono text-white font-bold">CDC TRIGGERS</div>
                      <div className="text-[9px] text-[#00F0FF] animate-pulse">Live Syncing</div>
                    </div>

                    <div className="p-3 rounded-lg bg-[#0D1117] border border-[#FF9F0A]/40 text-center space-y-1">
                      <div className="text-[10px] font-mono text-[#FF9F0A] font-bold">STAGE 4: RENAME</div>
                      <div className="text-xs font-mono text-white font-bold">ATOMIC SWAP</div>
                      <div className="text-[9px] text-slate-400">Lock: &lt; 2ms</div>
                    </div>
                  </div>
                </div>

                {/* MIGRATION REVISIONS TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      ACTIVE REVISION MANIFEST ({revisions.length})
                    </h3>
                    <span className="text-xs font-mono text-slate-400">IDEMPOTENT</span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-[#05070B] text-slate-400 border-b border-[#1F2937]">
                        <tr>
                          <th className="py-2.5 px-3">REVISION</th>
                          <th className="py-2.5 px-3">OPERATION</th>
                          <th className="py-2.5 px-3">TARGET TABLE</th>
                          <th className="py-2.5 px-3">PROGRESS</th>
                          <th className="py-2.5 px-3">DURATION</th>
                          <th className="py-2.5 px-3">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/60">
                        {revisions.map(r => (
                          <tr key={r.rev} className="hover:bg-[#05070B]/50 transition-colors">
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">{r.rev}</td>
                            <td className="py-2.5 px-3 text-white">{r.name}</td>
                            <td className="py-2.5 px-3 text-[#00F0FF]">{r.table}</td>
                            <td className="py-2.5 px-3 text-slate-300 font-bold">{r.progress}</td>
                            <td className="py-2.5 px-3 text-slate-400">{r.duration}</td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                r.status === 'APPLIED' ? 'bg-green-500/10 text-green-400 border-green-500/30' :
                                r.status === 'EXECUTING' ? 'bg-[#00F0FF]/10 text-[#00F0FF] border-[#00F0FF]/30' :
                                'bg-[#1F2937] text-slate-400 border-slate-600'
                              }`}>
                                {r.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: MONRONEY SPEC CARD & DDL EVENT LOG */}
              <div className="space-y-6">

                {/* TRACK 2 MONRONEY COMMERCIAL SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">DEALERSHIP MONRONEY SPEC</span>
                    <h3 className="text-lg font-black font-mono text-white">IRON-SCHEMA</h3>
                    <p className="text-xs text-slate-400">Database Migration Lock & DDL Execution Timeline</p>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">CHASSIS ID</span>
                      <span className="text-white font-bold">GF-T2-IRON-09</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE DDL STREAM */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE ONLINE DDL ENGINE FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">CDC STREAM</span>
                  </div>

                  <div className="space-y-2">
                    {ddlLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{log.act}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="text-green-400 text-[10px]">
                          ✓ REPLICA SAFE
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IronSchemaCockpit />);
  </script>
</body>
</html>
