[pytest]
# Root test discovery for the 17 sealed triads (gf-t3-338 .. gf-t3-354).
testpaths =
    engines/track3-skunkworks/gf-t3-338
    engines/track3-skunkworks/gf-t3-339
    engines/track3-skunkworks/gf-t3-340
    engines/track3-skunkworks/gf-t3-341
    engines/track3-skunkworks/gf-t3-342
    engines/track3-skunkworks/gf-t3-343
    engines/track3-skunkworks/gf-t3-344
    engines/track3-skunkworks/gf-t3-345
    engines/track3-skunkworks/gf-t3-346
    engines/track3-skunkworks/gf-t3-347
    engines/track3-skunkworks/gf-t3-348
    engines/track3-skunkworks/gf-t3-349
    engines/track3-skunkworks/gf-t3-350
    engines/track3-skunkworks/gf-t3-351
    engines/track3-skunkworks/gf-t3-352
    engines/track3-skunkworks/gf-t3-353
    engines/track3-skunkworks/gf-t3-354
python_files = test_*.py
# importlib mode: gf-t3-340 and gf-t3-354 share a test filename; root conftest.py isolates each triad's `engine`.
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = node_modules .venv venv dist site __pycache__
