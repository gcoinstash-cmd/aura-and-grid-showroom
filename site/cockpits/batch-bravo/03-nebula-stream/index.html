<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEBULA-STREAM // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const TOPIC_PARTITIONS = [
      { id: 'TOPIC-RAW-TELEMETRY', type: 'CORE-INGEST', partitions: 16, throughput: '24.8k msg/s', lag: '12 msgs', status: 'HEALTHY' },
      { id: 'TOPIC-CHASSIS-CANBUS', type: 'CORE-INGEST', partitions: 8, throughput: '18.2k msg/s', lag: '4 msgs', status: 'HEALTHY' },
      { id: 'TOPIC-AGGREGATOR-SINK', type: 'ANALYTICS', partitions: 12, throughput: '14.1k msg/s', lag: '42 msgs', status: 'HEALTHY' },
      { id: 'TOPIC-DLQ-RETRY-STREAM', type: 'DEAD-LETTER', partitions: 4, throughput: '12 msg/s', lag: '0 msgs', status: 'NOMINAL' }
    ];

    function NebulaStreamCockpit() {
      const [filterType, setFilterType] = useState('ALL');
      const [msgPerSec, setMsgPerSec] = useState(64200);
      const [lagOffset, setLagOffset] = useState(58);
      const [waveOffset, setWaveOffset] = useState(0);
      const [eventLogs, setEventLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setWaveOffset(prev => (prev + 1) % 50);
          setMsgPerSec(prev => prev + Math.floor((Math.random() - 0.5) * 600));
          setLagOffset(prev => Math.max(10, prev + Math.floor((Math.random() - 0.5) * 12)));

          const topics = ['TOPIC-RAW-TELEMETRY', 'TOPIC-CHASSIS-CANBUS', 'TOPIC-AGGREGATOR-SINK', 'TOPIC-DLQ-RETRY-STREAM'];
          const topic = topics[Math.floor(Math.random() * topics.length)];
          const partition = `P-${Math.floor(Math.random() * 8)}`;
          const bytes = Math.floor(256 + Math.random() * 1024);
          const lag = Math.floor(Math.random() * 6);

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            topic,
            partition,
            bytes: `${bytes} B`,
            lag: `${lag} msgs`
          };

          setEventLogs(prev => [newLog, ...prev.slice(0, 6)]);
        }, 800);

        return () => clearInterval(interval);
      }, []);

      const filteredTopics = filterType === 'ALL' ? TOPIC_PARTITIONS : TOPIC_PARTITIONS.filter(t => t.type === filterType);

      // SVG sine wave path
      const generateWavePath = () => {
        let path = "M 0 50 ";
        for (let x = 0; x <= 600; x += 20) {
          const y = 50 + Math.sin((x + waveOffset * 8) * 0.05) * 25 + Math.cos((x + waveOffset * 4) * 0.03) * 10;
          path += `L ${x} ${y.toFixed(1)} `;
        }
        return path;
      };

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER STATUS */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-NEBULA-03</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    NEBULA-STREAM <span className="text-xs text-[#FF9F0A] font-normal">// KAFKA EVENT-BUS WAVEFORM CONSOLE</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">PARTITION MESH:</span>
                  <span className="text-green-400 font-bold">40 PARTITIONS</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">CLUSTER STATE:</span>
                  <span className="text-[#00F0FF] font-bold">IN-SYNC (ISR 100%)</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, WAVEFORM, PARTITION MATRIX */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">AGGREGATE STREAM INGESTION</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">+2.8% LIVE</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{msgPerSec.toLocaleString()}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">msg/s</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>PEAK CAPACITY: 120k msg/s</span>
                      <span className="text-green-400 font-bold">NOMINAL</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">CONSUMER GROUP LAG</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">&lt; 0.01% DRAIN</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{lagOffset}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">msgs</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>CONSUMER HEALTH: 8 WORKERS</span>
                      <span className="text-green-400 font-bold">DRAINING</span>
                    </div>
                  </div>
                </div>

                {/* ANIMATED SVG CARRIER SINE WAVE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      REALTIME EVENT-BUS THROUGHPUT WAVEFORM
                    </h3>
                    <span className="text-xs font-mono text-[#00F0FF]">CARRIER: 100 Hz</span>
                  </div>

                  <div className="h-28 bg-[#05070B] border border-[#1F2937] rounded-xl flex items-center justify-center p-2 overflow-hidden relative">
                    <svg viewBox="0 0 600 100" className="w-full h-full preserve-3d">
                      <path d={generateWavePath()} fill="none" stroke="#00F0FF" strokeWidth="2.5" className="drop-shadow-[0_0_8px_#00F0FF]" />
                    </svg>
                  </div>
                </div>

                {/* TOPIC PARTITION MATRIX */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-3">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#FF9F0A]" />
                      KAFKA TOPIC REPLICATION MATRIX
                    </h3>
                    <div className="flex gap-2">
                      {['ALL', 'CORE-INGEST', 'ANALYTICS', 'DEAD-LETTER'].map((type) => (
                        <button
                          key={type}
                          onClick={() => setFilterType(type)}
                          className={`px-3 py-1 rounded text-xs font-mono font-bold uppercase transition-colors ${
                            filterType === type
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#1F2937] text-slate-300 hover:bg-slate-700'
                          }`}
                        >
                          {type}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-[#1F2937] text-slate-400">
                          <th className="py-2 px-3">TOPIC</th>
                          <th className="py-2 px-3">CATEGORY</th>
                          <th className="py-2 px-3">PARTITIONS</th>
                          <th className="py-2 px-3">INGRESS RATE</th>
                          <th className="py-2 px-3">CONSUMER LAG</th>
                          <th className="py-2 px-3 text-right">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/50">
                        {filteredTopics.map((t) => (
                          <tr key={t.id} className="hover:bg-[#1F2937]/30 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{t.id}</td>
                            <td className="py-2.5 px-3 text-slate-400">{t.type}</td>
                            <td className="py-2.5 px-3 text-white">{t.partitions}</td>
                            <td className="py-2.5 px-3 text-green-400">{t.throughput}</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">{t.lag}</td>
                            <td className="py-2.5 px-3 text-right">
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/30">
                                {t.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: DEALERSHIP SPEC & LIVE EVENT SINK */}
              <div className="space-y-6">

                {/* DEALERSHIP MONRONEY SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono text-[#00F0FF] font-bold tracking-widest uppercase">SPECIFICATION MONRONEY</span>
                    <h2 className="text-lg font-black text-white font-mono mt-1">GF-T2-NEBULA-03</h2>
                    <p className="text-xs text-slate-400 font-sans">Track 2 Hypercar Flagship Event-Bus Console</p>
                  </div>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">MODEL</span>
                      <span className="text-white font-bold">NEBULA-STREAM</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE EVENT BUS SINK FEED */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE PARTITION INGRESS FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">KAFKA CLUSTER</span>
                  </div>

                  <div className="space-y-2">
                    {eventLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-[#00F0FF] font-bold truncate max-w-[150px]">{log.topic}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center text-slate-300">
                          <span className="text-white">{log.partition} // {log.bytes}</span>
                          <span className="text-green-400 font-bold">LAG: {log.lag}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebulaStreamCockpit />);
  </script>
</body>
</html>
