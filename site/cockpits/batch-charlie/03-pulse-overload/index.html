<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE-OVERLOAD // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const INITIAL_SERVICES = [
      { id: 'PAYMENT-SVC', state: 'CLOSED', errorRate: '0.4%', latency: '18ms', canarySuccess: '100%', cooldown: '0s' },
      { id: 'AUTH-GATEWAY', state: 'CLOSED', errorRate: '0.1%', latency: '6ms', canarySuccess: '100%', cooldown: '0s' },
      { id: 'SEARCH-INDEX', state: 'HALF-OPEN', errorRate: '12.8%', latency: '142ms', canarySuccess: '82%', cooldown: '4s' },
      { id: 'ORDER-DISPATCH', state: 'CLOSED', errorRate: '0.2%', latency: '12ms', canarySuccess: '100%', cooldown: '0s' },
      { id: 'NOTIFY-BUS', state: 'OPEN', errorRate: '68.4%', latency: '850ms', canarySuccess: '0%', cooldown: '18s' }
    ];

    function PulseOverloadCockpit() {
      const [services, setServices] = useState(INITIAL_SERVICES);
      const [filterState, setFilterState] = useState('ALL');
      const [systemHealth, setSystemHealth] = useState(94.2);
      const [trippedCount, setTrippedCount] = useState(1);
      const [breakerLogs, setBreakerLogs] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setSystemHealth(Number((92 + Math.random() * 6).toFixed(1)));

          const svcNames = ['SEARCH-INDEX', 'PAYMENT-SVC', 'NOTIFY-BUS', 'AUTH-GATEWAY', 'ORDER-DISPATCH'];
          const actions = [
            'CANARY_PROBE_SUCCESS',
            'CIRCUIT_STABILIZED (CLOSED)',
            'ERROR_THRESHOLD_EXCEEDED',
            'CIRCUIT_TRIPPED (OPEN)',
            'RESET_TIMEOUT_EXPIRED (HALF-OPEN)'
          ];

          const svc = svcNames[Math.floor(Math.random() * svcNames.length)];
          const act = actions[Math.floor(Math.random() * actions.length)];

          const newLog = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            svc,
            act,
            isTrip: act.includes('TRIPPED') || act.includes('EXCEEDED')
          };

          setBreakerLogs(prev => [newLog, ...prev.slice(0, 5)]);
        }, 950);

        return () => clearInterval(interval);
      }, []);

      const triggerFault = (serviceId) => {
        setServices(prev => prev.map(s => {
          if (s.id === serviceId || (!serviceId && s.id === 'PAYMENT-SVC')) {
            return {
              ...s,
              state: 'OPEN',
              errorRate: '84.2%',
              latency: '1250ms',
              cooldown: '30s',
              canarySuccess: '0%'
            };
          }
          return s;
        }));
        setTrippedCount(prev => prev + 1);
      };

      const filteredServices = filterState === 'ALL'
        ? services
        : services.filter(s => s.state === filterState);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-PULSE-03</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    PULSE-OVERLOAD <span className="text-xs text-[#FF9F0A] font-normal">// CIRCUIT BREAKER FAILURE STATE RADAR</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">STATE MACHINE:</span>
                  <span className="text-green-400 font-bold">HYSTRIX / RESILIENCE4J</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">SHORT-CIRCUIT:</span>
                  <span className="text-[#00F0FF] font-bold">SUB-MILLI FAIL-FAST</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, RADAR STATUS, SERVICES */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">RESILIENCE SCORE</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">AUTO-HEALING</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{systemHealth}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">%</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>OPEN CIRCUITS: {services.filter(s => s.state === 'OPEN').length}</span>
                      <span className="text-green-400">FALLBACKS READY</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">FAIL-FAST REJECTIONS</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">ZERO BACKPRESSURE</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">1,842</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">reqs/s</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>ISOLATION: BULKHEAD</span>
                      <button onClick={() => triggerFault('PAYMENT-SVC')} className="text-[#FF9F0A] hover:underline font-bold">
                        ⚡ TRIP PAYMENT BREAKER
                      </button>
                    </div>
                  </div>
                </div>

                {/* ANIMATED CIRCUIT STATE VISUALIZER */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      CIRCUIT BREAKER STATE MACHINE TRANSITION MESH
                    </h3>
                    <span className="text-xs font-mono text-slate-400">SLIDING WINDOW: 10s</span>
                  </div>

                  <div className="grid grid-cols-3 gap-4 bg-[#05070B] border border-[#1F2937] p-6 rounded-xl text-center">
                    {/* CLOSED */}
                    <div className="p-4 rounded-lg bg-[#0D1117] border border-green-500/40 relative">
                      <div className="w-3 h-3 rounded-full bg-green-400 mx-auto mb-2" />
                      <div className="text-sm font-mono font-bold text-green-400">CLOSED</div>
                      <div className="text-[11px] text-slate-400 mt-1">Normal Ingress</div>
                      <div className="text-[10px] font-mono text-slate-500 mt-2">Error &lt; 50%</div>
                    </div>

                    {/* OPEN */}
                    <div className="p-4 rounded-lg bg-[#0D1117] border border-red-500/40 relative">
                      <div className="w-3 h-3 rounded-full bg-red-400 mx-auto mb-2 animate-ping" />
                      <div className="text-sm font-mono font-bold text-red-400">OPEN</div>
                      <div className="text-[11px] text-slate-400 mt-1">Fail-Fast (Blocked)</div>
                      <div className="text-[10px] font-mono text-slate-500 mt-2">Trip Duration: 30s</div>
                    </div>

                    {/* HALF-OPEN */}
                    <div className="p-4 rounded-lg bg-[#0D1117] border border-[#FF9F0A]/40 relative">
                      <div className="w-3 h-3 rounded-full bg-[#FF9F0A] mx-auto mb-2" />
                      <div className="text-sm font-mono font-bold text-[#FF9F0A]">HALF-OPEN</div>
                      <div className="text-[11px] text-slate-400 mt-1">Canary Trial Run</div>
                      <div className="text-[10px] font-mono text-slate-500 mt-2">Sample Size: 10 reqs</div>
                    </div>
                  </div>
                </div>

                {/* SERVICES STATUS TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      MICROSERVICES CIRCUIT DIRECTORY ({filteredServices.length})
                    </h3>
                    <div className="flex gap-1 text-xs font-mono">
                      {['ALL', 'CLOSED', 'HALF-OPEN', 'OPEN'].map(st => (
                        <button
                          key={st}
                          onClick={() => setFilterState(st)}
                          className={`px-2.5 py-1 rounded text-[11px] font-bold transition-colors ${
                            filterState === st
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#05070B] text-slate-400 hover:text-white border border-[#1F2937]'
                          }`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-[#05070B] text-slate-400 border-b border-[#1F2937]">
                        <tr>
                          <th className="py-2.5 px-3">SERVICE NAME</th>
                          <th className="py-2.5 px-3">CIRCUIT STATE</th>
                          <th className="py-2.5 px-3">ERROR RATE</th>
                          <th className="py-2.5 px-3">LATENCY</th>
                          <th className="py-2.5 px-3">CANARY PASS</th>
                          <th className="py-2.5 px-3">COOLDOWN</th>
                          <th className="py-2.5 px-3">ACTION</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/60">
                        {filteredServices.map(svc => (
                          <tr key={svc.id} className="hover:bg-[#05070B]/50 transition-colors">
                            <td className="py-2.5 px-3 text-white font-bold">{svc.id}</td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                svc.state === 'CLOSED' ? 'bg-green-500/10 text-green-400 border-green-500/30' :
                                svc.state === 'HALF-OPEN' ? 'bg-[#FF9F0A]/10 text-[#FF9F0A] border-[#FF9F0A]/30' :
                                'bg-red-500/10 text-red-400 border-red-500/30'
                              }`}>
                                {svc.state}
                              </span>
                            </td>
                            <td className="py-2.5 px-3 text-[#FF9F0A]">{svc.errorRate}</td>
                            <td className="py-2.5 px-3 text-slate-300">{svc.latency}</td>
                            <td className="py-2.5 px-3 text-slate-400">{svc.canarySuccess}</td>
                            <td className="py-2.5 px-3 text-[#00F0FF]">{svc.cooldown}</td>
                            <td className="py-2.5 px-3">
                              <button
                                onClick={() => triggerFault(svc.id)}
                                className="px-2 py-0.5 rounded text-[10px] font-bold bg-[#1F2937] hover:bg-red-500/20 text-slate-300 hover:text-red-400 border border-slate-600 transition-colors"
                              >
                                TRIP
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: MONRONEY SPEC CARD & BREAKER EVENT STREAM */}
              <div className="space-y-6">

                {/* TRACK 2 MONRONEY COMMERCIAL SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">DEALERSHIP MONRONEY SPEC</span>
                    <h3 className="text-lg font-black font-mono text-white">PULSE-OVERLOAD</h3>
                    <p className="text-xs text-slate-400">Circuit Breaker Failure State & Recovery Radar</p>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">CHASSIS ID</span>
                      <span className="text-white font-bold">GF-T2-PULSE-03</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE STATE TRANSITION FEED */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE BREAKER TRANSITION FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">STATE AUDIT</span>
                  </div>

                  <div className="space-y-2">
                    {breakerLogs.map((log) => (
                      <div key={log.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{log.svc}</span>
                          <span className="text-slate-500">{log.time}</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span className={`font-bold ${log.isTrip ? 'text-red-400' : 'text-green-400'}`}>
                            {log.act}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PulseOverloadCockpit />);
  </script>
</body>
</html>
