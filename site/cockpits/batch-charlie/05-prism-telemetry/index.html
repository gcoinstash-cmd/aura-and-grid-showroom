<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRISM-TELEMETRY // Track 2 Hypercar Flagship Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #05070B; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
</head>
<body class="bg-[#05070B] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';

    const MOCK_SPANS = [
      { id: 'span-01', service: 'ingress-gateway', name: 'HTTP POST /api/v1/checkout', duration: '42.8ms', offsetPct: 0, widthPct: 100, status: 'OK' },
      { id: 'span-02', service: 'auth-validator', name: 'JWT Verify & Claims Extraction', duration: '3.4ms', offsetPct: 4, widthPct: 12, status: 'OK' },
      { id: 'span-03', service: 'postgres-pool', name: 'SELECT FOR UPDATE balance FROM ledger', duration: '14.2ms', offsetPct: 18, widthPct: 38, status: 'OK' },
      { id: 'span-04', service: 'redis-cache', name: 'GET session:token:cache', duration: '1.1ms', offsetPct: 58, widthPct: 8, status: 'OK' },
      { id: 'span-05', service: 'kafka-producer', name: 'PUBLISH checkout.completed', duration: '6.8ms', offsetPct: 68, widthPct: 22, status: 'OK' }
    ];

    const RECENT_TRACES = [
      { id: 'tr-9981a', traceId: '4bf92f3577b3...0e0e4736', root: '/api/v1/checkout', spans: 5, duration: '42.8ms', status: 'OK' },
      { id: 'tr-9982b', traceId: '8a1c904e22df...11fa9900', root: '/api/v1/telemetry', spans: 8, duration: '18.4ms', status: 'OK' },
      { id: 'tr-9983c', traceId: '3c89012fbbaa...8831ef01', root: '/api/v1/auth/jwt', spans: 4, duration: '142.0ms', status: 'SLOW' },
      { id: 'tr-9984d', traceId: '09da781c00fa...4510bc44', root: '/v1/order/dispatch', spans: 6, duration: '98.2ms', status: 'OK' },
      { id: 'tr-9985e', traceId: '9921fb4431cc...ee291077', root: '/api/v1/payment', spans: 7, duration: '820.5ms', status: 'ERROR' }
    ];

    function PrismTelemetryCockpit() {
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [tracesIngested, setTracesIngested] = useState(482910);
      const [p99Latency, setP99Latency] = useState(48.2);
      const [activeTraceLog, setActiveTraceLog] = useState([]);

      useEffect(() => {
        const interval = setInterval(() => {
          setTracesIngested(prev => prev + Math.floor(Math.random() * 45) + 20);
          setP99Latency(Number((46 + Math.random() * 4.5).toFixed(1)));

          const roots = ['/api/v1/checkout', '/v1/auth/verify', '/telemetry/stream', '/order/cancel', '/kms/sign'];
          const statuses = ['OK', 'OK', 'OK', 'SLOW', 'ERROR'];
          const randIdx = Math.floor(Math.random() * roots.length);

          const newTrace = {
            id: Math.random().toString(36).substring(2, 8).toUpperCase(),
            time: new Date().toISOString().split('T')[1].slice(0, 12),
            root: roots[randIdx],
            status: statuses[randIdx],
            dur: `${(12 + Math.random() * 95).toFixed(1)}ms`
          };

          setActiveTraceLog(prev => [newTrace, ...prev.slice(0, 5)]);
        }, 900);

        return () => clearInterval(interval);
      }, []);

      const filteredTraces = filterStatus === 'ALL'
        ? RECENT_TRACES
        : RECENT_TRACES.filter(t => t.status === filterStatus);

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-200 font-sans p-4 md:p-8 select-none">
          <div className="max-w-7xl mx-auto space-y-6">

            {/* TOP HEADER */}
            <header className="flex flex-wrap items-center justify-between border-b border-[#1F2937] pb-4 gap-4 bg-[#0D1117] p-4 rounded-xl border border-[#1F2937]">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-[#00F0FF] animate-pulse" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold tracking-widest text-[#00F0FF] uppercase">TRACK 2 // HYPERCAR FLAGSHIP</span>
                    <span className="text-[10px] bg-[#1F2937] text-slate-300 px-2 py-0.5 rounded font-mono">GF-T2-PRISM-05</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight text-white font-mono flex items-center gap-2">
                    PRISM-TELEMETRY <span className="text-xs text-[#FF9F0A] font-normal">// DISTRIBUTED OPENTELEMETRY SPAN EXPLORER</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs font-mono">
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">STANDARD:</span>
                  <span className="text-green-400 font-bold">W3C TRACE CONTEXT / OTLP</span>
                </div>
                <div className="bg-[#05070B] border border-[#1F2937] px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-slate-400">SAMPLING:</span>
                  <span className="text-[#00F0FF] font-bold">100% HEAD-BASED</span>
                </div>
              </div>
            </header>

            {/* MAIN TELEMETRY LAYOUT */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

              {/* LEFT 2 COLUMNS: METRICS, SPAN WATERFALL, TRACE MATRIX */}
              <div className="lg:col-span-2 space-y-6">

                {/* DUAL METRIC CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#00F0FF]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">AGGREGATE SPANS RECORDED</span>
                      <span className="text-xs font-mono text-[#00F0FF] bg-[#00F0FF]/10 px-2 py-0.5 rounded">REALTIME OTLP</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{tracesIngested.toLocaleString()}</span>
                      <span className="text-sm font-mono text-[#00F0FF]">spans</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>DROP RATE: 0.00%</span>
                      <span className="text-green-400">BUFFERS OK</span>
                    </div>
                  </div>

                  <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#FF9F0A]" />
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">DISTRIBUTED P99 LATENCY</span>
                      <span className="text-xs font-mono text-[#FF9F0A] bg-[#FF9F0A]/10 px-2 py-0.5 rounded">CROSS-SERVICE</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl md:text-5xl font-black font-mono text-white tracking-tight">{p99Latency}</span>
                      <span className="text-sm font-mono text-[#FF9F0A]">ms</span>
                    </div>
                    <div className="mt-4 flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>ROOT SPAN SLA: 50ms</span>
                      <span className="text-green-400">WITHIN SLA</span>
                    </div>
                  </div>
                </div>

                {/* ANIMATED SPAN WATERFALL EXPLORER */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      ACTIVE TRACE EXECUTION WATERFALL (TRACE-ID: 4bf92f3577b34da6...)
                    </h3>
                    <span className="text-xs font-mono text-[#00F0FF]">TOTAL: 42.8ms</span>
                  </div>

                  <div className="bg-[#05070B] border border-[#1F2937] p-5 rounded-xl space-y-3">
                    {MOCK_SPANS.map(span => (
                      <div key={span.id} className="space-y-1">
                        <div className="flex justify-between text-xs font-mono">
                          <span className="text-white font-bold">{span.service} <span className="text-slate-400 font-normal">→ {span.name}</span></span>
                          <span className="text-[#FF9F0A] font-bold">{span.duration}</span>
                        </div>
                        <div className="w-full h-4 bg-[#0D1117] rounded border border-[#1F2937] relative overflow-hidden">
                          <div
                            className="h-full bg-gradient-to-r from-[#00F0FF] to-[#FF9F0A] rounded relative"
                            style={{
                              marginLeft: `${span.offsetPct}%`,
                              width: `${span.widthPct}%`
                            }}
                          >
                            <span className="absolute right-1 top-0 text-[9px] font-mono font-bold text-black leading-4">
                              {span.duration}
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* RECENT TRACE SESSIONS TABLE */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-6 rounded-xl space-y-4">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h3 className="text-sm font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#00F0FF]" />
                      DISTRIBUTED TRACE INVENTORY ({filteredTraces.length})
                    </h3>
                    <div className="flex gap-1 text-xs font-mono">
                      {['ALL', 'OK', 'SLOW', 'ERROR'].map(st => (
                        <button
                          key={st}
                          onClick={() => setFilterStatus(st)}
                          className={`px-2.5 py-1 rounded text-[11px] font-bold transition-colors ${
                            filterStatus === st
                              ? 'bg-[#00F0FF] text-black'
                              : 'bg-[#05070B] text-slate-400 hover:text-white border border-[#1F2937]'
                          }`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-[#05070B] text-slate-400 border-b border-[#1F2937]">
                        <tr>
                          <th className="py-2.5 px-3">TRACE ID</th>
                          <th className="py-2.5 px-3">ROOT ENDPOINT</th>
                          <th className="py-2.5 px-3">SPANS</th>
                          <th className="py-2.5 px-3">DURATION</th>
                          <th className="py-2.5 px-3">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1F2937]/60">
                        {filteredTraces.map(tr => (
                          <tr key={tr.id} className="hover:bg-[#05070B]/50 transition-colors">
                            <td className="py-2.5 px-3 text-[#00F0FF] font-bold">{tr.traceId}</td>
                            <td className="py-2.5 px-3 text-white">{tr.root}</td>
                            <td className="py-2.5 px-3 text-slate-400">{tr.spans} spans</td>
                            <td className="py-2.5 px-3 text-[#FF9F0A] font-bold">{tr.duration}</td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                tr.status === 'OK' ? 'bg-green-500/10 text-green-400 border-green-500/30' :
                                tr.status === 'SLOW' ? 'bg-[#FF9F0A]/10 text-[#FF9F0A] border-[#FF9F0A]/30' :
                                'bg-red-500/10 text-red-400 border-red-500/30'
                              }`}>
                                {tr.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: MONRONEY SPEC CARD & LIVE OTLP STREAM */}
              <div className="space-y-6">

                {/* TRACK 2 MONRONEY COMMERCIAL SPECIFICATION */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-4">
                  <div className="border-b border-[#1F2937] pb-3">
                    <span className="text-[10px] font-mono font-bold tracking-widest text-[#FF9F0A] uppercase">DEALERSHIP MONRONEY SPEC</span>
                    <h3 className="text-lg font-black font-mono text-white">PRISM-TELEMETRY</h3>
                    <p className="text-xs text-slate-400">Distributed OpenTelemetry Span & Trace Explorer</p>
                  </div>

                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">CHASSIS ID</span>
                      <span className="text-white font-bold">GF-T2-PRISM-05</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">COMMERCIAL TAG</span>
                      <span className="text-[#00F0FF] font-bold">100% PURE APA TITLE</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">TITLE ANCHOR</span>
                      <span className="text-white font-bold">$14,500 USD</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">VAULT BUYOUT</span>
                      <span className="text-[#FF9F0A] font-bold">$25,000 – $50,000</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-[#1F2937]/50">
                      <span className="text-slate-400">SEAT TIERS</span>
                      <span className="text-slate-400">ZERO (APA CLEAN TITLE)</span>
                    </div>
                  </div>

                  {/* COMMERCIAL ACTION TARGETS (VERTICAL CONTAINER) */}
                  <div className="pt-2">
                    <div className="flex flex-col gap-2 w-full">
                      <button className="w-full py-3 bg-[#FF9F0A] hover:bg-[#FF9F0A]/90 text-black font-mono font-black text-xs uppercase tracking-wider rounded-lg transition-colors shadow-lg shadow-[#FF9F0A]/20">
                        ACQUIRE TITLE (APA)
                      </button>
                      <button className="w-full py-2.5 bg-[#1F2937] hover:bg-slate-700 text-slate-200 font-mono font-bold text-xs uppercase tracking-wider rounded-lg border border-slate-600 transition-colors">
                        INQUIRE VAULT BUYOUT
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 text-[10px] font-mono text-slate-500 leading-tight">
                    [Product Truth: Interactive Prototype // Simulated Data Stream]
                  </div>
                </div>

                {/* LIVE OTLP INGESTION STREAM */}
                <div className="bg-[#0D1117] border border-[#1F2937] p-5 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00F0FF] animate-ping" />
                      LIVE OTLP INGESTION FEED
                    </h4>
                    <span className="text-[10px] font-mono text-slate-500">SPAN STREAM</span>
                  </div>

                  <div className="space-y-2">
                    {activeTraceLog.map((tr) => (
                      <div key={tr.id} className="p-2.5 rounded bg-[#05070B] border border-[#1F2937] text-[11px] font-mono space-y-1">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="text-white font-bold">{tr.root}</span>
                          <span className="text-slate-500">{tr.time}</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span className={`font-bold ${
                            tr.status === 'OK' ? 'text-green-400' : (tr.status === 'SLOW' ? 'text-[#FF9F0A]' : 'text-red-400')
                          }`}>
                            {tr.status}
                          </span>
                          <span className="text-[#00F0FF] font-bold">{tr.dur}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PrismTelemetryCockpit />);
  </script>
</body>
</html>
